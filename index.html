<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berkant Hoca - Ödev Takip Sistemi</title>
    
    <!-- Tailwind CSS (Tasarım Kütüphanesi) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React ve Babel (Kodun Tarayıcıda Çalışması İçin) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Modül Haritası (Kütüphaneleri İnternetten Çeker) -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
        }
    }
    </script>

    <style>
        /* Kaydırma çubuğu özelleştirmesi */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <div id="root"></div>

    <!-- Uygulama Kodları -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import ReactDOM from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, setDoc, onSnapshot } from 'firebase/firestore';
        import { 
            ChevronRight, ChevronDown, CheckCircle, XCircle, Clock, 
            Plus, Trash2, Lock, Unlock, Loader2, 
            MoreVertical, MinusCircle, ArrowDownToLine, UserPlus, KeyRound,
            Megaphone, Edit3, Save, X, Layout, BookOpen, AlertTriangle, GraduationCap, Quote
        } from 'lucide-react';

        // --- Firebase Ayarları ---
        const firebaseConfig = {
            apiKey: "AIzaSyDNfK49NR1dfbN0TSb35FI85huw8YJfcyQ",
            authDomain: "odevtakip-145f5.firebaseapp.com",
            projectId: "odevtakip-145f5",
            storageBucket: "odevtakip-145f5.firebasestorage.app",
            messagingSenderId: "1083778395806",
            appId: "1:1083778395806:web:c67f99e34a11e5a330958f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- Sabitler ---
        const COLLECTION_NAME = 'homework_tracker'; 
        const DOC_ID = 'main_list_v8_berkant_hoca'; 
        const DOC_ID_SETTINGS = 'settings'; 
        const DEFAULT_PIN = "1234"; 

        // --- Renk Paletleri ---
        const TOPIC_THEMES = [
            { bg: 'bg-indigo-100', border: 'border-indigo-300', text: 'text-indigo-900', hover: 'hover:bg-indigo-200' },
            { bg: 'bg-rose-100', border: 'border-rose-300', text: 'text-rose-900', hover: 'hover:bg-rose-200' },
            { bg: 'bg-emerald-100', border: 'border-emerald-300', text: 'text-emerald-900', hover: 'hover:bg-emerald-200' },
            { bg: 'bg-amber-100', border: 'border-amber-300', text: 'text-amber-900', hover: 'hover:bg-amber-200' },
            { bg: 'bg-sky-100', border: 'border-sky-300', text: 'text-sky-900', hover: 'hover:bg-sky-200' },
            { bg: 'bg-fuchsia-100', border: 'border-fuchsia-300', text: 'text-fuchsia-900', hover: 'hover:bg-fuchsia-200' },
        ];

        const STUDENT_ROW_COLORS = [
            '#fce7f3', '#e0f2fe', '#dcfce7', '#fef3c7', 
            '#ede9fe', '#ffedd5', '#fae8ff', '#ecfccb'
        ];

        const STATUS_OPTIONS = [
            { id: 'assigned', label: 'Ödev Verildi', icon: Clock, color: 'text-amber-700', bg: 'bg-amber-100', border: 'border-amber-300' },
            { id: 'done', label: 'Yapıldı', icon: CheckCircle, color: 'text-green-700', bg: 'bg-green-100', border: 'border-green-300' },
            { id: 'missing', label: 'Eksik / Yapılmadı', icon: XCircle, color: 'text-red-700', bg: 'bg-red-100', border: 'border-red-300' },
            { id: 'exempt', label: 'Muaf / Boş', icon: MinusCircle, color: 'text-gray-500', bg: 'bg-gray-100', border: 'border-gray-300' },
        ];

        const MOTIVATIONAL_QUOTE = {
            text: "Başarı, her gün tekrarlanan küçük çabaların toplamıdır.",
            author: "Robert Collier"
        };

        const HomeworkTracker = () => {
            const [user, setUser] = useState(null);
            const [classes, setClasses] = useState([]);
            const [loading, setLoading] = useState(true);
            const [saveStatus, setSaveStatus] = useState('idle'); 
            const [isTeacherMode, setIsTeacherMode] = useState(false);
            const [dbTeacherPin, setDbTeacherPin] = useState(DEFAULT_PIN);
            const [announcement, setAnnouncement] = useState("");
            const [tempAnnouncement, setTempAnnouncement] = useState("");
            const [isEditingAnnouncement, setIsEditingAnnouncement] = useState(false);
            const [pinInput, setPinInput] = useState("");
            const [showPinModal, setShowPinModal] = useState(false);
            const [showChangePinModal, setShowChangePinModal] = useState(false);
            const [newPin, setNewPin] = useState("");
            const [newStudentName, setNewStudentName] = useState("");
            const [modalType, setModalType] = useState(null); 
            const [modalData, setModalData] = useState({}); 
            const [modalInputVal, setModalInputVal] = useState(""); 
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [studentNoteInput, setStudentNoteInput] = useState("");
            const [activeCell, setActiveCell] = useState(null); 
            const [activeColMenu, setActiveColMenu] = useState(null); 
            const [activeTopicMenu, setActiveTopicMenu] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);

            useEffect(() => {
                const initAuth = async () => {
                try { await signInAnonymously(auth); } catch (error) { console.error(error); }
                };
                initAuth();
                return onAuthStateChanged(auth, (u) => u && setUser(u));
            }, []);

            useEffect(() => {
                if (!user) return;
                const docRef = doc(db, COLLECTION_NAME, DOC_ID);
                const unsubClasses = onSnapshot(docRef, (snap) => {
                if (snap.exists()) setClasses(snap.data().classes || []);
                else { setDoc(docRef, { classes: [] }); setClasses([]); }
                setLoading(false);
                });
                const settingsRef = doc(db, COLLECTION_NAME, DOC_ID_SETTINGS);
                const unsubSettings = onSnapshot(settingsRef, (snap) => {
                if (snap.exists()) {
                    const d = snap.data();
                    if (d.pin) setDbTeacherPin(d.pin);
                    if (d.announcement !== undefined) setAnnouncement(d.announcement);
                } else {
                    setDoc(settingsRef, { pin: DEFAULT_PIN, announcement: "Hoşgeldiniz!" });
                }
                });
                return () => { unsubClasses(); unsubSettings(); };
            }, [user]);

            const saveData = async (newData) => {
                if (!user) return;
                setSaveStatus('saving');
                try {
                const docRef = doc(db, COLLECTION_NAME, DOC_ID);
                await setDoc(docRef, { classes: newData }, { merge: true });
                setSaveStatus('success');
                setTimeout(() => setSaveStatus('idle'), 1500);
                } catch (err) {
                console.error(err);
                setSaveStatus('error');
                }
            };

            const generateId = (prefix) => `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;

            const handleModalSubmit = () => {
                if (!modalInputVal.trim()) return;
                let updated = [...classes];
                if (modalType === 'class') {
                const newCls = { id: generateId('class'), className: modalInputVal, isOpen: true, topics: [], students: [] };
                updated = [...updated, newCls];
                } else if (modalType === 'topic') {
                updated = updated.map(cls => {
                    if (cls.id !== modalData.classId) return cls;
                    const newTopic = { id: generateId('topic'), title: modalInputVal, subColumns: [] };
                    return { ...cls, topics: [...(cls.topics || []), newTopic] };
                });
                } else if (modalType === 'source') {
                updated = updated.map(cls => {
                    if (cls.id !== modalData.classId) return cls;
                    const updatedTopics = cls.topics.map(topic => {
                    if (topic.id !== modalData.topicId) return topic;
                    return { ...topic, subColumns: [...topic.subColumns, { id: generateId('col'), title: modalInputVal }] };
                    });
                    return { ...cls, topics: updatedTopics };
                });
                }
                setClasses(updated); saveData(updated); closeModal();
            };

            const closeModal = () => {
                setModalType(null); setModalData({}); setModalInputVal("");
            };
            const openModal = (type, data = {}) => {
                setModalType(type); setModalData(data); setModalInputVal("");
            };

            const deleteClass = (e, id) => {
                e.stopPropagation();
                setConfirmModal({
                message: "Bu sınıfı ve tüm içeriğini kalıcı olarak silmek istiyor musunuz?",
                type: 'danger',
                onConfirm: () => {
                    const updated = classes.filter(c => c.id !== id);
                    setClasses(updated); saveData(updated); setConfirmModal(null);
                }
                });
            };

            const deleteStudent = (e, classId, sId) => {
                e.stopPropagation();
                setConfirmModal({
                message: "Bu öğrenciyi silmek istediğinize emin misiniz?",
                type: 'danger',
                onConfirm: () => {
                    const updated = classes.map(cls => cls.id === classId ? { ...cls, students: cls.students.filter(s => s.id !== sId) } : cls);
                    setClasses(updated); saveData(updated); setConfirmModal(null);
                }
                });
            };

            const deleteColumn = (classId, topicId, colId) => {
                setActiveColMenu(null);
                setConfirmModal({
                message: "Bu kaynağı (sütunu) silmek istiyor musunuz?",
                type: 'danger',
                onConfirm: () => {
                    const updated = classes.map(cls => {
                    if (cls.id !== classId) return cls;
                    const updatedTopics = cls.topics.map(t => {
                        if (t.id !== topicId) return t;
                        return { ...t, subColumns: t.subColumns.filter(c => c.id !== colId) };
                    });
                    return { ...cls, topics: updatedTopics };
                    });
                    setClasses(updated); saveData(updated); setConfirmModal(null);
                }
                });
            };

            const handleTopicBulkAction = (action, classId, topicId) => {
                setActiveTopicMenu(null);
                if (!isTeacherMode) return;
                if (action === 'delete') {
                setConfirmModal({
                    message: "Konuyu ve altındaki tüm kaynakları silmek istediğinize emin misiniz?",
                    type: 'danger',
                    onConfirm: () => {
                    const updated = classes.map(cls => {
                        if (cls.id !== classId) return cls;
                        return { ...cls, topics: cls.topics.filter(t => t.id !== topicId) };
                    });
                    setClasses(updated); saveData(updated); setConfirmModal(null);
                    }
                });
                return;
                }
                const cls = classes.find(c => c.id === classId);
                const topic = cls?.topics.find(t => t.id === topicId);
                if (!topic?.subColumns?.length) { alert("İşlem yapılacak kaynak bulunamadı!"); return; }
                setConfirmModal({
                message: `Konu altındaki tüm kaynaklar güncellenecek. Onaylıyor musunuz?`,
                type: 'info',
                onConfirm: () => {
                    const updated = classes.map(cls => {
                    if (cls.id !== classId) return cls;
                    const targetTopic = cls.topics.find(t => t.id === topicId);
                    const targetColIds = targetTopic.subColumns.map(sc => sc.id);
                    const updatedStudents = cls.students.map(std => {
                        const newGrades = { ...std.grades };
                        targetColIds.forEach(colId => newGrades[colId] = action);
                        return { ...std, grades: newGrades };
                    });
                    return { ...cls, students: updatedStudents };
                    });
                    setClasses(updated); saveData(updated); setConfirmModal(null);
                }
                });
            };

            const updateGrade = (classId, studentId, colId, status) => {
                const updated = classes.map(cls => {
                if (cls.id !== classId) return cls;
                const updatedStudents = cls.students.map(std => {
                    if (std.id !== studentId) return std;
                    return { ...std, grades: { ...std.grades, [colId]: status } };
                });
                return { ...cls, students: updatedStudents };
                });
                setClasses(updated); saveData(updated); setActiveCell(null);
            };

            const addStudent = (classId) => {
                if (!newStudentName.trim()) return;
                const updated = classes.map(cls => {
                if (cls.id !== classId) return cls;
                return { ...cls, students: [...cls.students, { id: generateId('student'), name: newStudentName, grades: {}, privateNotes: "" }] };
                });
                setClasses(updated); saveData(updated); setNewStudentName("");
            };

            const saveStudentNote = () => {
                if (!selectedStudent) return;
                const { classId, student } = selectedStudent;
                const updated = classes.map(cls => {
                if (cls.id !== classId) return cls;
                const updatedStudents = cls.students.map(s => {
                    if (s.id !== student.id) return s;
                    return { ...s, privateNotes: studentNoteInput };
                });
                return { ...cls, students: updatedStudents };
                });
                setClasses(updated); saveData(updated); setSelectedStudent(null);
            };

            const saveAnnouncementFn = async () => {
                try { await setDoc(doc(db, COLLECTION_NAME, DOC_ID_SETTINGS), { announcement: tempAnnouncement }, { merge: true }); setIsEditingAnnouncement(false); } catch (e) { alert("Hata"); }
            };
            const updatePinFn = async () => {
                if (newPin.length < 4) return alert("En az 4 karakter.");
                await setDoc(doc(db, COLLECTION_NAME, DOC_ID_SETTINGS), { pin: newPin }, { merge: true }); setShowChangePinModal(false); setNewPin(""); alert("Şifre değişti.");
            };

            const StatusBadge = ({ status }) => {
                const opt = STATUS_OPTIONS.find(o => o.id === status) || STATUS_OPTIONS[3];
                const Icon = opt.icon;
                return (
                <div className={`flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg border ${opt.bg} ${opt.color} ${opt.border} shadow-sm w-full h-full transition-all hover:brightness-95`}>
                    <Icon size={15} strokeWidth={2.5} />
                    <span className="text-xs font-bold truncate hidden lg:inline">{opt.label.split('/')[0]}</span>
                </div>
                );
            };

            if (loading) return <div className="flex h-screen items-center justify-center text-indigo-600"><Loader2 className="animate-spin" size={40}/></div>;

            return (
                <div className="min-h-screen bg-slate-100 font-sans text-slate-800 pb-40">
                {(activeCell || activeColMenu || activeTopicMenu) && (
                    <div className="fixed inset-0 z-40 bg-transparent" onClick={() => { setActiveCell(null); setActiveColMenu(null); setActiveTopicMenu(null); }}/>
                )}
                <div className="bg-white shadow-md sticky top-0 z-[60] border-b border-indigo-100">
                    <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
                    <div className="flex items-center gap-3">
                        <div className="bg-indigo-600 text-white p-2.5 rounded-xl shadow-indigo-200 shadow-lg"><GraduationCap size={28} /></div>
                        <div className="flex flex-col">
                        <h1 className="text-2xl font-black text-slate-800 tracking-tight leading-none">ÖDEV TAKİP</h1>
                        <span className="text-indigo-600 font-bold text-sm tracking-wide">BERKANT HOCA</span>
                        </div>
                    </div>
                    <div className="hidden md:flex flex-col items-center justify-center flex-1 mx-8 opacity-80">
                        <div className="flex items-center gap-2 text-slate-600 italic text-sm text-center">
                            <Quote size={14} className="text-indigo-400 rotate-180 mb-2"/>{MOTIVATIONAL_QUOTE.text}<Quote size={14} className="text-indigo-400 mb-2"/>
                        </div>
                        <span className="text-[10px] font-bold text-indigo-500 mt-1 uppercase tracking-widest">- {MOTIVATIONAL_QUOTE.author} -</span>
                    </div>
                    <div className="flex items-center gap-3">
                        <span className="text-xs font-medium px-3 py-1 bg-slate-100 rounded-full text-slate-500">{isTeacherMode ? 'Yönetici Modu' : 'Öğrenci Modu'}</span>
                        {isTeacherMode && <button onClick={() => setShowChangePinModal(true)} className="p-2 text-slate-400 hover:text-indigo-600 bg-slate-50 hover:bg-indigo-50 rounded-lg transition-colors"><KeyRound size={20} /></button>}
                        <button onClick={() => isTeacherMode ? setIsTeacherMode(false) : setShowPinModal(true)} className={`flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all shadow-md active:scale-95 ${isTeacherMode ? "bg-rose-50 text-rose-600 border border-rose-100 hover:bg-rose-100" : "bg-indigo-600 text-white hover:bg-indigo-700 shadow-indigo-200"}`}>{isTeacherMode ? <Unlock size={16} /> : <Lock size={16} />}{isTeacherMode ? "Çıkış" : "Giriş"}</button>
                    </div>
                    </div>
                </div>
                <div className="max-w-7xl mx-auto px-4 mt-8">
                    <div className="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-100 p-5 rounded-2xl shadow-sm relative group overflow-hidden">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-amber-200/20 rounded-full -mr-10 -mt-10 blur-2xl pointer-events-none"></div>
                    <div className="flex items-start gap-4 relative z-10">
                        <div className="bg-white p-2 rounded-full shadow-sm text-amber-500"><Megaphone size={24} /></div>
                        <div className="flex-1">
                            <h3 className="font-bold text-amber-900 text-lg mb-1">Duyurular</h3>
                            {isEditingAnnouncement ? (
                                <div className="mt-2">
                                <textarea className="w-full p-3 border border-amber-200 rounded-xl bg-white/80 backdrop-blur text-sm focus:ring-2 focus:ring-amber-400 outline-none shadow-inner" rows={3} value={tempAnnouncement} onChange={(e) => setTempAnnouncement(e.target.value)}/>
                                <div className="flex justify-end gap-2 mt-3">
                                    <button onClick={() => setIsEditingAnnouncement(false)} className="px-4 py-2 text-xs font-bold text-slate-500 hover:bg-white rounded-lg transition-colors">Vazgeç</button>
                                    <button onClick={saveAnnouncementFn} className="px-4 py-2 text-xs font-bold bg-amber-600 text-white rounded-lg hover:bg-amber-700 shadow-md shadow-amber-200 flex items-center gap-2"><Save size={14}/> Kaydet</button>
                                </div>
                                </div>
                            ) : (
                                <div className="text-slate-700 whitespace-pre-wrap leading-relaxed">{announcement}</div>
                            )}
                        </div>
                        {isTeacherMode && !isEditingAnnouncement && (
                            <button onClick={() => { setTempAnnouncement(announcement); setIsEditingAnnouncement(true); }} className="p-2 text-amber-400 hover:text-amber-700 bg-white/50 hover:bg-white rounded-lg transition-all shadow-sm"><Edit3 size={18} /></button>
                        )}
                    </div>
                    </div>
                </div>
                <div className="max-w-7xl mx-auto px-4 mt-8 flex flex-col gap-10">
                    {classes.length === 0 && !loading && (
                        <div className="text-center py-24 bg-white rounded-3xl border-2 border-dashed border-slate-200 shadow-sm">
                        <div className="bg-slate-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300"><Layout size={40}/></div>
                        <h2 className="text-slate-500 font-medium text-lg">Henüz hiç sınıf eklenmedi.</h2>
                        {isTeacherMode && <button onClick={() => openModal('class')} className="mt-4 text-indigo-600 font-bold hover:underline hover:text-indigo-700 transition-colors">Yeni Sınıf Oluştur</button>}
                        </div>
                    )}
                    {classes.map((cls) => (
                        <div key={cls.id} className="bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 overflow-hidden transition-all duration-300 hover:shadow-2xl">
                        <div className="bg-white p-5 border-b border-slate-100 flex items-center justify-between cursor-pointer hover:bg-slate-50/50 transition-colors" onClick={() => { const updated = classes.map(c => c.id === cls.id ? { ...c, isOpen: !c.isOpen } : c); setClasses(updated); }}>
                            <div className="flex items-center gap-4">
                                <div className={`p-2 rounded-xl transition-all duration-300 ${cls.isOpen ? 'bg-indigo-600 text-white rotate-90 shadow-lg shadow-indigo-200' : 'bg-slate-100 text-slate-400'}`}><ChevronRight size={20} /></div>
                                <div><h2 className="text-2xl font-bold text-slate-800">{cls.className}</h2><span className="text-xs font-semibold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md">{cls.students.length} Öğrenci</span></div>
                            </div>
                            {isTeacherMode && (
                                <div className="flex items-center gap-2">
                                    <button onClick={(e) => { e.stopPropagation(); openModal('topic', { classId: cls.id }); }} className="flex items-center gap-2 px-4 py-2 bg-indigo-50 text-indigo-600 rounded-xl text-xs font-bold hover:bg-indigo-100 transition-colors"><Layout size={16}/> Konu Ekle</button>
                                    <button onClick={(e) => deleteClass(e, cls.id)} className="p-2.5 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all"><Trash2 size={20} className="pointer-events-none" /></button>
                                </div>
                            )}
                        </div>
                        {cls.isOpen && (
                            <div className="overflow-x-auto relative w-full">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                    <tr>
                                        <th rowSpan={2} className="sticky left-0 top-0 z-50 bg-white border-b border-r border-slate-200 min-w-[240px] shadow-[4px_0_12px_-4px_rgba(0,0,0,0.1)] p-0 align-bottom">
                                            <div className="p-4 bg-slate-50/80 backdrop-blur border-b border-slate-100 h-full flex items-end pb-4 font-bold text-slate-600">Öğrenci Listesi</div>
                                        </th>
                                        {cls.topics?.map((topic, index) => {
                                            const theme = TOPIC_THEMES[index % TOPIC_THEMES.length];
                                            return (
                                                <th key={topic.id} colSpan={Math.max(1, (topic.subColumns?.length || 0) + (isTeacherMode ? 1 : 0))} className={`text-center py-3 px-2 border-r border-b border-slate-200 ${theme.bg} ${theme.text} relative group`}>
                                                <div className="flex items-center justify-center gap-2 font-black tracking-wider text-xs uppercase">{topic.title}{isTeacherMode && <button onClick={(e) => { e.stopPropagation(); setActiveTopicMenu({ classId: cls.id, topicId: topic.id, anchorEl: e.currentTarget }); }} className={`opacity-0 group-hover:opacity-100 p-1.5 rounded-lg bg-white/50 hover:bg-white text-current transition-all`}><MoreVertical size={14} className="pointer-events-none"/></button>}</div>
                                                </th>
                                            );
                                        })}
                                    </tr>
                                    <tr>
                                        {cls.topics?.map((topic) => (
                                            <React.Fragment key={topic.id}>
                                                {topic.subColumns?.map((col) => (
                                                <th key={col.id} className="min-w-[150px] py-3 px-2 border-r border-b border-slate-200 bg-slate-50/50 group hover:bg-slate-100 transition-colors align-top">
                                                    <div className={`flex flex-col items-center justify-center gap-1 cursor-pointer ${isTeacherMode ? 'hover:text-indigo-600' : ''}`} onClick={(e) => { if(!isTeacherMode) return; e.stopPropagation(); setActiveColMenu({ classId: cls.id, topicId: topic.id, colId: col.id, anchorEl: e.currentTarget }); }}>
                                                        <span className="text-xs font-bold text-slate-600 text-center line-clamp-2">{col.title}</span>{isTeacherMode && <ChevronDown size={12} className="opacity-0 group-hover:opacity-100 text-slate-400"/>}
                                                    </div>
                                                </th>
                                                ))}
                                                {isTeacherMode && (
                                                <th className="min-w-[50px] border-r border-b border-slate-200 bg-slate-50/30 hover:bg-indigo-50 transition-colors p-0 text-center align-middle">
                                                    <button onClick={() => openModal('source', { classId: cls.id, topicId: topic.id })} className="w-full h-full py-4 flex items-center justify-center text-slate-300 hover:text-indigo-600 transition-colors" title="Kaynak Ekle"><Plus size={18} /></button>
                                                </th>
                                                )}
                                            </React.Fragment>
                                        ))}
                                    </tr>
                                    </thead>
                                    <tbody className="bg-white">
                                    {cls.students.map((student, sIndex) => {
                                        const rowColor = STUDENT_ROW_COLORS[sIndex % STUDENT_ROW_COLORS.length];
                                        return (
                                            <tr key={student.id} className="group transition-colors hover:brightness-95" style={{ backgroundColor: rowColor }}>
                                                <td className="sticky left-0 z-40 border-r border-slate-200/80 py-3 px-4 shadow-[4px_0_12px_-4px_rgba(0,0,0,0.05)]" style={{ backgroundColor: rowColor }}>
                                                <div className="flex items-center justify-between">
                                                    <button onClick={(e) => { if (isTeacherMode) { e.stopPropagation(); setStudentNoteInput(student.privateNotes || ""); setSelectedStudent({ student, classId: cls.id }); } }} className={`flex items-center gap-3 flex-1 text-left ${isTeacherMode ? 'cursor-pointer hover:opacity-70' : ''}`}>
                                                        <div className="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center text-sm font-black shadow-md shadow-indigo-200">{student.name.charAt(0)}</div>
                                                        <div><span className="font-bold text-slate-800 text-sm block">{student.name}</span>{isTeacherMode && student.privateNotes && <span className="text-[10px] text-indigo-600 flex items-center gap-0.5"><BookOpen size={10}/> Not</span>}</div>
                                                    </button>
                                                    {isTeacherMode && <button onClick={(e) => deleteStudent(e, cls.id, student.id)} className="text-slate-300 hover:text-rose-500 p-1.5 rounded-lg hover:bg-rose-50 transition-colors opacity-0 group-hover:opacity-100"><Trash2 size={16} className="pointer-events-none"/></button>}
                                                </div>
                                                </td>
                                                {cls.topics?.map((topic) => (
                                                <React.Fragment key={topic.id}>
                                                    {topic.subColumns?.map((col) => {
                                                        const status = student.grades[col.id] || 'exempt';
                                                        return (
                                                            <td key={col.id} className="p-2 border-r border-slate-100/50 text-center align-middle">
                                                            <div onClick={(e) => { if (!isTeacherMode) return; e.stopPropagation(); setActiveCell({ classId: cls.id, studentId: student.id, colId: col.id, anchorEl: e.currentTarget }); }} className={`cursor-pointer transform transition-transform active:scale-95 ${!isTeacherMode && 'pointer-events-none'}`}>
                                                                <StatusBadge status={status} />
                                                            </div>
                                                            </td>
                                                        );
                                                    })}
                                                    {isTeacherMode && <td className="border-r border-slate-100/50 bg-black/5"></td>}
                                                </React.Fragment>
                                                ))}
                                            </tr>
                                        );
                                    })}
                                    {isTeacherMode && (
                                        <tr>
                                            <td className="sticky left-0 z-40 bg-white border-r border-slate-200 p-4 shadow-[4px_0_12px_-4px_rgba(0,0,0,0.05)] border-t border-slate-100">
                                                <div className="flex items-center gap-2">
                                                <div className="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 border border-dashed border-slate-300"><UserPlus size={16} /></div>
                                                <input type="text" placeholder="Öğrenci Adı..." className="text-sm border-none bg-transparent w-full focus:ring-0 placeholder:text-slate-400 font-medium" value={newStudentName} onChange={(e) => setNewStudentName(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addStudent(cls.id)} />
                                                <button onClick={() => addStudent(cls.id)} disabled={!newStudentName} className="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg hover:bg-indigo-100 disabled:opacity-50">EKLE</button>
                                                </div>
                                            </td>
                                            <td colSpan={100} className="bg-slate-50/50 border-t border-slate-100"></td>
                                        </tr>
                                    )}
                                    </tbody>
                                </table>
                            </div>
                        )}
                        </div>
                    ))}
                    {isTeacherMode && <div className="flex justify-center pb-8"><button onClick={() => openModal('class')} className="flex items-center gap-3 bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-xl shadow-indigo-200 hover:bg-indigo-700 hover:scale-105 transition-all"><Plus size={24}/> YENİ SINIF OLUŞTUR</button></div>}
                </div>
                {activeTopicMenu && (
                    <div className="absolute z-50 bg-white rounded-xl shadow-2xl border border-slate-100 p-1 w-64 animate-in zoom-in-95" style={{ top: activeTopicMenu.anchorEl.getBoundingClientRect().bottom + window.scrollY + 5, left: activeTopicMenu.anchorEl.getBoundingClientRect().left + window.scrollX }} onClick={(e) => e.stopPropagation()}>
                    <div className="p-1">
                        <div className="text-[10px] font-bold text-slate-400 px-3 py-2 uppercase tracking-wider">Toplu İşlemler</div>
                        <button onClick={() => handleTopicBulkAction('assigned', activeTopicMenu.classId, activeTopicMenu.topicId)} className="w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-amber-50 text-amber-700 text-xs font-bold transition-colors"><ArrowDownToLine size={16}/> Konuyu Herkese Ödev Ver</button>
                        <button onClick={() => handleTopicBulkAction('done', activeTopicMenu.classId, activeTopicMenu.topicId)} className="w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-green-50 text-green-700 text-xs font-bold transition-colors"><CheckCircle size={16}/> Konuyu "Yapıldı" Yap</button>
                    </div>
                    <div className="h-px bg-slate-100 my-1"></div>
                    <div className="p-1"><button onClick={() => handleTopicBulkAction('delete', activeTopicMenu.classId, activeTopicMenu.topicId)} className="w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-rose-50 text-rose-600 text-xs font-bold transition-colors"><Trash2 size={16}/> Konuyu Tamamen Sil</button></div>
                    </div>
                )}
                {activeColMenu && (
                    <div className="absolute z-50 bg-white rounded-xl shadow-2xl border border-slate-100 p-1 w-48 animate-in zoom-in-95" style={{ top: activeColMenu.anchorEl.getBoundingClientRect().bottom + window.scrollY + 5, left: activeColMenu.anchorEl.getBoundingClientRect().left + window.scrollX }} onClick={(e) => e.stopPropagation()}>
                    <div className="p-1"><button onClick={() => deleteColumn(activeColMenu.classId, activeColMenu.topicId, activeColMenu.colId)} className="w-full text-left flex items-center gap-2 px-3 py-2.5 rounded-lg hover:bg-rose-50 text-rose-600 text-xs font-bold transition-colors"><Trash2 size={16}/> Kaynağı Sil</button></div>
                    </div>
                )}
                {activeCell && (
                    <div className="absolute z-50 bg-white rounded-xl shadow-2xl border border-slate-100 p-2 w-56 animate-in zoom-in-95" style={{ top: activeCell.anchorEl.getBoundingClientRect().bottom + window.scrollY + 8, left: Math.min(activeCell.anchorEl.getBoundingClientRect().left + window.scrollX - 20, window.innerWidth - 240) }} onClick={(e) => e.stopPropagation()}>
                    {STATUS_OPTIONS.map(opt => <button key={opt.id} onClick={() => updateGrade(activeCell.classId, activeCell.studentId, activeCell.colId, opt.id)} className="w-full text-left flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-slate-50 transition-colors group mb-1 last:mb-0"><opt.icon size={18} className={opt.color} /><span className="text-sm font-bold text-slate-700 group-hover:text-slate-900">{opt.label.split('/')[0]}</span></button>)}
                    </div>
                )}
                {modalType && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-200">
                        <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden scale-100 transform transition-all">
                        <div className="bg-slate-50 p-6 border-b border-slate-100 flex justify-between items-center"><h3 className="text-lg font-black text-slate-800 uppercase tracking-wide">{modalType === 'class' ? 'Yeni Sınıf Oluştur' : modalType === 'topic' ? 'Yeni Konu Ekle' : 'Yeni Kaynak Ekle'}</h3><button onClick={closeModal} className="text-slate-400 hover:text-slate-600"><X size={24}/></button></div>
                        <div className="p-8">
                            <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Başlık / İsim</label>
                            <input autoFocus type="text" className="w-full text-lg p-4 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all font-bold text-slate-800" placeholder={modalType === 'class' ? 'Örn: 12 Sayısal A' : modalType === 'topic' ? 'Örn: Türev' : 'Örn: VDD Video Ders'} value={modalInputVal} onChange={(e) => setModalInputVal(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleModalSubmit()} />
                        </div>
                        <div className="p-6 bg-slate-50 border-t border-slate-100 flex gap-3"><button onClick={closeModal} className="flex-1 py-3.5 rounded-xl font-bold text-slate-500 hover:bg-white hover:shadow-sm border border-transparent hover:border-slate-200 transition-all">Vazgeç</button><button onClick={handleModalSubmit} className="flex-1 py-3.5 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all">Kaydet</button></div>
                        </div>
                    </div>
                )}
                {confirmModal && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center">
                        <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6 ${confirmModal.type === 'danger' ? 'bg-rose-100 text-rose-600' : 'bg-indigo-100 text-indigo-600'}`}><AlertTriangle size={32} /></div>
                        <h3 className="text-xl font-black text-slate-800 mb-2">Emin misiniz?</h3>
                        <p className="text-slate-500 font-medium mb-8 leading-relaxed">{confirmModal.message}</p>
                        <div className="flex gap-3"><button onClick={() => setConfirmModal(null)} className="flex-1 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-50">Vazgeç</button><button onClick={confirmModal.onConfirm} className={`flex-1 py-3 rounded-xl text-white font-bold shadow-lg ${confirmModal.type === 'danger' ? 'bg-rose-600 hover:bg-rose-700 shadow-rose-200' : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-200'}`}>Onayla</button></div>
                    </div>
                    </div>
                )}
                {selectedStudent && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in">
                    <div className="bg-white rounded-2xl w-full max-w-lg shadow-2xl flex flex-col max-h-[90vh]">
                        <div className="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                            <div className="flex items-center gap-4"><div className="w-14 h-14 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xl font-black shadow-lg shadow-indigo-200">{selectedStudent.student.name.charAt(0)}</div><div><h3 className="text-xl font-black text-slate-800">{selectedStudent.student.name}</h3><p className="text-xs font-bold text-indigo-500 uppercase tracking-wide">Öğrenci Takip Notları</p></div></div>
                            <button onClick={() => setSelectedStudent(null)} className="p-2 hover:bg-slate-200 rounded-full transition-colors"><X size={24} className="text-slate-400"/></button>
                        </div>
                        <div className="p-8 overflow-y-auto flex-1"><label className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2"><BookOpen size={16}/> Çözdüğü Kaynaklar & İlerleme Durumu</label><textarea className="w-full h-48 p-5 border border-slate-200 rounded-2xl bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none resize-none text-base leading-relaxed text-slate-700 font-medium" placeholder="Örn: 345 TYT Matematik - Fonksiyonlar bitti..." value={studentNoteInput} onChange={(e) => setStudentNoteInput(e.target.value)}></textarea></div>
                        <div className="p-6 border-t border-slate-100 bg-slate-50 rounded-b-2xl flex justify-end gap-3"><button onClick={() => setSelectedStudent(null)} className="px-6 py-3 text-slate-500 font-bold hover:bg-white hover:shadow-sm rounded-xl transition-all">Kapat</button><button onClick={saveStudentNote} className="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 transform active:scale-95 transition-all flex items-center gap-2"><Save size={18} /> Kaydet</button></div>
                    </div>
                    </div>
                )}
                {showPinModal && (
                    <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-in fade-in">
                    <div className="bg-white rounded-3xl p-10 w-full max-w-sm shadow-2xl relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-rose-500"></div>
                        <div className="flex justify-center mb-6"><div className="bg-indigo-50 p-4 rounded-full text-indigo-600"><Lock size={32}/></div></div>
                        <h3 className="text-2xl font-black text-slate-800 mb-2 text-center">Öğretmen Girişi</h3>
                        <p className="text-slate-400 text-sm text-center mb-8 font-medium">Lütfen 4 haneli pin kodunuzu giriniz.</p>
                        <input autoFocus type="password" className="w-full text-center text-4xl font-mono tracking-[0.5em] p-4 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none bg-slate-50 mb-8 transition-all text-slate-800 placeholder:text-slate-200" placeholder="••••" value={pinInput} onChange={(e) => setPinInput(e.target.value)} onKeyDown={(e) => { if(e.key==='Enter'){ if(pinInput===dbTeacherPin){setIsTeacherMode(true);setShowPinModal(false);setPinInput("");}else{alert("Hatalı PIN");} } }} />
                        <button onClick={() => { if(pinInput===dbTeacherPin){setIsTeacherMode(true);setShowPinModal(false);setPinInput("");}else{alert("Hatalı PIN");} }} className="w-full py-4 text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 font-bold shadow-xl shadow-indigo-200 transition-all active:scale-95 text-lg">GİRİŞ YAP</button>
                        <button onClick={() => setShowPinModal(false)} className="w-full py-4 text-slate-400 hover:text-slate-600 text-sm font-bold mt-2">Vazgeç</button>
                    </div>
                    </div>
                )}
                {showChangePinModal && (
                    <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl">
                        <h3 className="text-xl font-black text-slate-800 mb-6 text-center">Şifre Değiştir</h3>
                        <input autoFocus type="text" className="w-full text-center text-2xl tracking-widest p-4 border border-slate-200 rounded-xl mb-6 bg-slate-50 focus:ring-4 focus:ring-indigo-100 outline-none font-bold" placeholder="Yeni Pin" value={newPin} onChange={(e) => setNewPin(e.target.value)} />
                        <button onClick={updatePinFn} className="w-full py-3.5 text-white bg-emerald-600 rounded-xl hover:bg-emerald-700 font-bold shadow-lg shadow-emerald-200 mb-3">GÜNCELLE</button>
                        <button onClick={() => setShowChangePinModal(false)} className="w-full py-3 text-slate-400 font-bold text-sm">İptal</button>
                    </div>
                    </div>
                )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HomeworkTracker />);
    </script>
</body>
</html>
