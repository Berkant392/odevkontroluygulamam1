<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Berkant Hoca - Eğitim Platformu</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
        }
    }
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#8b5cf6',
                        accent: '#ec4899',
                    },
                    animation: {
                        'spin-slow': 'spin 4s linear infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* --- SADELEŞTİRİLMİŞ AKIŞKAN NEON KART --- */
        
        .neon-card-wrapper {
            position: relative;
            z-index: 1;
            border-radius: 1.5rem;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
            cursor: pointer;
            /* Kart yüksekliği */
            min-height: 180px; 
            display: flex;
        }

        .neon-card-wrapper:hover {
            transform: scale(1.02);
        }

        /* Işık Katmanı (Çerçeve) */
        .neon-card-glow {
            position: absolute;
            inset: -4px; /* Çerçeve kalınlığı */
            border-radius: 1.7rem;
            /* Gökkuşağı Akışı */
            background: linear-gradient(
                90deg, 
                #ff0000, #ff7f00, #ffff00, #00ff00, 
                #0000ff, #4b0082, #9400d3, #ff0000
            );
            background-size: 400%;
            animation: flow-light 8s linear infinite;
            z-index: -1;
            filter: blur(8px); /* Hafif yumuşatma */
        }
        
        /* Daha belirgin bir kontür için ikinci katman */
        .neon-card-border-sharp {
            position: absolute;
            inset: -2px;
            border-radius: 1.6rem;
            background: linear-gradient(
                90deg, 
                #ff0000, #ff7f00, #ffff00, #00ff00, 
                #0000ff, #4b0082, #9400d3, #ff0000
            );
            background-size: 400%;
            animation: flow-light 8s linear infinite;
            z-index: -1;
        }

        /* Işık Akış Animasyonu */
        @keyframes flow-light {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }

        /* Kartın İçi (Beyaz Zemin) */
        .neon-card-content {
            background: white;
            border-radius: 1.5rem;
            width: 100%;
            height: 100%; /* Kapsayıcıyı doldur */
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 2rem;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02); /* Hafif iç gölge */
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .modal-anim { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .z-menu { z-index: 9999 !important; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import ReactDOM from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc, addDoc, query, orderBy } from 'firebase/firestore';
        import { 
            ChevronRight, ChevronLeft, CheckCircle, XCircle, Clock, 
            Plus, Trash2, Lock, Unlock, Loader2, 
            MoreVertical, MinusCircle, ArrowDownToLine, UserPlus, KeyRound,
            Megaphone, Edit3, Save, X, Layout, BookOpen, AlertTriangle, GraduationCap, Quote, RefreshCw, Library, List, Grid, CalendarDays
        } from 'lucide-react';

        const firebaseConfig = {
            apiKey: "AIzaSyDNfK49NR1dfbN0TSb35FI85huw8YJfcyQ",
            authDomain: "odevtakip-145f5.firebaseapp.com",
            projectId: "odevtakip-145f5",
            storageBucket: "odevtakip-145f5.firebasestorage.app",
            messagingSenderId: "1083778395806",
            appId: "1:1083778395806:web:c67f99e34a11e5a330958f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- VERİ YAPISI ---
        const CLASSES_COLLECTION = 'berkant_hoca_classes_secure';
        const LIBRARY_COLLECTION = 'berkant_hoca_library';
        const SETTINGS_PATH = { collection: 'settings', doc: 'global_settings' };
        const DEFAULT_PIN = "1234"; 

        const MOTIVATIONAL_QUOTES = [
            { text: "Başarı, her gün tekrarlanan küçük çabaların toplamıdır.", author: "Robert Collier" },
            { text: "Gelecek, bugünden ona hazırlananlara aittir.", author: "Malcolm X" },
            { text: "Bir şeyi başarmak için önce ona inanmalısın.", author: "Nikos Kazancakis" },
            { text: "Eğitim, dünyayı değiştirmek için kullanabileceğiniz en güçlü silahtır.", author: "Nelson Mandela" }
        ];

        const TOPIC_THEMES = [
            { text: 'text-indigo-600' }, { text: 'text-rose-600' }, { text: 'text-emerald-600' }, 
            { text: 'text-amber-600' }, { text: 'text-sky-600' }, { text: 'text-fuchsia-600' }
        ];

        const STATUS_OPTIONS = [
            { id: 'assigned', label: 'Verildi', icon: Clock, color: 'text-amber-600', bg: 'bg-amber-50', border: 'border-amber-200' },
            { id: 'done', label: 'Yapıldı', icon: CheckCircle, color: 'text-green-600', bg: 'bg-green-50', border: 'border-green-200' },
            { id: 'missing', label: 'Eksik', icon: XCircle, color: 'text-red-600', bg: 'bg-red-50', border: 'border-red-200' },
            { id: 'exempt', label: 'Muaf', icon: MinusCircle, color: 'text-slate-400', bg: 'bg-slate-100', border: 'border-slate-200' },
        ];

        // --- COUNTDOWN COMPONENT ---
        const CountdownTimer = () => {
            const [timeLeft, setTimeLeft] = useState({
                days: 0, hours: 0, minutes: 0, seconds: 0,
                progressDays: 0, progressHours: 0, progressMinutes: 0, progressSeconds: 0
            });

            useEffect(() => {
                const targetDate = new Date('2026-06-20T00:00:00');
                const startDate = new Date('2025-06-20T00:00:00');
                const totalDuration = targetDate - startDate;

                const timer = setInterval(() => {
                    const now = new Date();
                    const difference = targetDate - now;
                    const elapsed = now - startDate;

                    if (difference < 0) {
                        clearInterval(timer);
                        return;
                    }

                    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                    const minutes = Math.floor((difference / 1000 / 60) % 60);
                    const seconds = Math.floor((difference / 1000) % 60);

                    const progressDays = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
                    const progressHours = (hours / 24) * 100;
                    const progressMinutes = (minutes / 60) * 100;
                    const progressSeconds = (seconds / 60) * 100;

                    setTimeLeft({ 
                        days, hours, minutes, seconds,
                        progressDays, progressHours, progressMinutes, progressSeconds
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, []);

            const CircularProgress = ({ value, max, color, label, strokeColor }) => {
                const radius = 18;
                const circumference = 2 * Math.PI * radius;
                const offset = circumference - (value / 100) * circumference;

                return (
                    <div className="flex flex-col items-center">
                        <div className="relative w-14 h-14 md:w-16 md:h-16">
                            <svg className="w-full h-full transform -rotate-90" viewBox="0 0 40 40">
                                <circle className="text-slate-100" strokeWidth="3" stroke="currentColor" fill="transparent" r={radius} cx="20" cy="20"/>
                                <circle 
                                    className={`${strokeColor} transition-all duration-1000 ease-linear`} 
                                    strokeWidth="3" 
                                    strokeDasharray={circumference} 
                                    strokeDashoffset={offset} 
                                    strokeLinecap="round" 
                                    stroke="currentColor" 
                                    fill="transparent" 
                                    r={radius} 
                                    cx="20" 
                                    cy="20" 
                                />
                            </svg>
                            <div className="absolute top-0 left-0 w-full h-full flex flex-col items-center justify-center">
                                <span className={`text-lg font-black ${strokeColor}`}>{max}</span>
                            </div>
                        </div>
                        <span className="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-wider">{label}</span>
                    </div>
                );
            };

            return (
                <div className="max-w-6xl mx-auto px-4 mt-6">
                    <div className="bg-white rounded-2xl shadow-md border border-slate-200 p-6 relative overflow-hidden">
                        <div className="flex items-center justify-center gap-2 mb-4">
                            <CalendarDays className="text-indigo-600" size={18} />
                            <h3 className="text-sm font-bold text-slate-700 uppercase tracking-widest">Sınava Kalan Süre</h3>
                            <span className="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">20 Haz 2026</span>
                        </div>
                        <div className="flex justify-center gap-6 md:gap-12">
                            <CircularProgress value={timeLeft.progressDays} max={timeLeft.days} color="text-yellow-500" strokeColor="text-yellow-500" label="GÜN" />
                            <CircularProgress value={timeLeft.progressHours} max={timeLeft.hours} color="text-sky-500" strokeColor="text-sky-500" label="SAAT" />
                            <CircularProgress value={timeLeft.progressMinutes} max={timeLeft.minutes} color="text-emerald-500" strokeColor="text-emerald-500" label="DAK" />
                            <CircularProgress value={timeLeft.progressSeconds} max={timeLeft.seconds} color="text-teal-400" strokeColor="text-teal-400" label="SN" />
                        </div>
                    </div>
                </div>
            );
        };

        // --- ANA UYGULAMA ---
        const HomeworkTracker = () => {
            const [user, setUser] = useState(null);
            const [classes, setClasses] = useState([]);
            const [libraryItems, setLibraryItems] = useState([]); 
            const [loading, setLoading] = useState(true);
            const [isTeacherMode, setIsTeacherMode] = useState(false);
            const [dbTeacherPin, setDbTeacherPin] = useState(DEFAULT_PIN);
            const [announcement, setAnnouncement] = useState("");
            const [tempAnnouncement, setTempAnnouncement] = useState("");
            const [isEditingAnnouncement, setIsEditingAnnouncement] = useState(false);
            
            const [view, setView] = useState('home');
            const [selectedClass, setSelectedClass] = useState(null);
            const [selectedStudentForView, setSelectedStudentForView] = useState(null);

            const [pinInput, setPinInput] = useState("");
            const [newPin, setNewPin] = useState("");
            const [newStudentName, setNewStudentName] = useState("");
            const [libraryInput, setLibraryInput] = useState(""); 

            const [showPinModal, setShowPinModal] = useState(false);
            const [showChangePinModal, setShowChangePinModal] = useState(false);
            const [showLibraryManager, setShowLibraryManager] = useState(false); 
            const [modalType, setModalType] = useState(null); 
            const [modalData, setModalData] = useState({}); 
            const [modalInputVal, setModalInputVal] = useState(""); 
            const [useLibrary, setUseLibrary] = useState(false); 
            const [selectedStudentForNote, setSelectedStudentForNote] = useState(null); 
            const [studentNoteInput, setStudentNoteInput] = useState("");
            const [activeCell, setActiveCell] = useState(null); 
            const [activeColMenu, setActiveColMenu] = useState(null); 
            const [activeTopicMenu, setActiveTopicMenu] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);
            const [dailyQuote, setDailyQuote] = useState(MOTIVATIONAL_QUOTES[0]);

            useEffect(() => {
                const initAuth = async () => { try { await signInAnonymously(auth); } catch (e) { console.error(e); } };
                initAuth();
                setDailyQuote(MOTIVATIONAL_QUOTES[Math.floor(Math.random() * MOTIVATIONAL_QUOTES.length)]);
                return onAuthStateChanged(auth, (u) => u && setUser(u));
            }, []);

            useEffect(() => {
                if (!user) return;
                
                const qClasses = query(collection(db, CLASSES_COLLECTION));
                const unsubClasses = onSnapshot(qClasses, (snap) => {
                    const loaded = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    loaded.sort((a, b) => a.className.localeCompare(b.className));
                    setClasses(loaded);
                    setLoading(false);
                });

                const qLib = query(collection(db, LIBRARY_COLLECTION));
                const unsubLib = onSnapshot(qLib, (snap) => setLibraryItems(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>a.text.localeCompare(b.text))));

                // AYARLARI DİNLE (PIN & DUYURU)
                const settingsRef = doc(db, SETTINGS_PATH.collection, SETTINGS_PATH.doc);
                const unsubSettings = onSnapshot(settingsRef, (snap) => {
                    if (snap.exists()) {
                        const d = snap.data();
                        // DİKKAT: Şifreyi string'e çeviriyoruz ki 1234 (sayı) ile "1234" (yazı) fark etmesin
                        if (d.pin !== undefined) setDbTeacherPin(String(d.pin).trim());
                        if (d.announcement !== undefined) setAnnouncement(d.announcement);
                    } else {
                        // Eğer ayar dosyası yoksa oluştur (Firebase'de görünmesi için)
                        setDoc(settingsRef, { pin: DEFAULT_PIN, announcement: "Hoşgeldiniz!" }, { merge: true });
                        setDbTeacherPin(DEFAULT_PIN);
                    }
                });

                return () => { unsubClasses(); unsubLib(); unsubSettings(); };
            }, [user]);

            const addClassToDb = async (newClass) => { await setDoc(doc(db, CLASSES_COLLECTION, String(newClass.id)), newClass); };
            const updateClassInDb = async (updatedClass) => { await setDoc(doc(db, CLASSES_COLLECTION, String(updatedClass.id)), updatedClass, { merge: true }); };
            const deleteClassFromDb = async (classId) => { await deleteDoc(doc(db, CLASSES_COLLECTION, String(classId))); };
            
            const addLibraryItem = async (text) => { 
                if(!text || typeof text !== 'string' || !text.trim()) return; 
                await addDoc(collection(db, LIBRARY_COLLECTION), { text: text.trim() }); 
            };
            
            const deleteLibraryItem = async (id) => { await deleteDoc(doc(db, LIBRARY_COLLECTION, id)); };
            const saveAnnouncementFn = async () => { try { await setDoc(doc(db, SETTINGS_PATH.collection, SETTINGS_PATH.doc), { announcement: tempAnnouncement }, { merge: true }); setIsEditingAnnouncement(false); } catch (e) { alert("Hata"); } };
            
            const updatePinFn = async () => { 
                if (!newPin || String(newPin).length < 4) return alert("En az 4 karakter."); 
                // Yeni şifreyi String olarak kaydediyoruz
                await setDoc(doc(db, SETTINGS_PATH.collection, SETTINGS_PATH.doc), { pin: String(newPin).trim() }, { merge: true }); 
                setShowChangePinModal(false); 
                setNewPin(""); 
                alert("Şifre değişti. Yeni şifrenizle giriş yapabilirsiniz."); 
            };

            const verifyPin = () => {
                // Her iki tarafı da string'e çevirip boşlukları temizleyerek karşılaştır
                if (String(pinInput).trim() === String(dbTeacherPin).trim()) {
                    setIsTeacherMode(true);
                    setShowPinModal(false);
                    setPinInput("");
                } else {
                    alert("Hatalı PIN!");
                }
            };

            const generateId = (p) => `${p}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            
            const handleModalSubmit = () => {
                if (!modalInputVal || !modalInputVal.trim()) return;
                if (modalType === 'class') {
                    addClassToDb({ id: generateId('class'), className: modalInputVal, topics: [], students: [] });
                } else if (modalType === 'topic' || modalType === 'source') {
                    const cls = classes.find(c => c.id === modalData.classId);
                    if (cls) {
                        if (modalType === 'topic') {
                            updateClassInDb({ ...cls, topics: [...(cls.topics || []), { id: generateId('topic'), title: modalInputVal, subColumns: [] }] });
                        } else {
                            const updatedTopics = cls.topics.map(t => t.id === modalData.topicId ? { ...t, subColumns: [...t.subColumns, { id: generateId('col'), title: modalInputVal }] } : t);
                            updateClassInDb({ ...cls, topics: updatedTopics });
                        }
                    }
                }
                closeModal();
            };

            const closeModal = () => { setModalType(null); setModalData({}); setModalInputVal(""); setUseLibrary(false); };
            const updateGrade = (cId, sId, colId, status) => {
                const cls = classes.find(c => c.id === cId);
                if (cls) {
                    const updatedStudents = cls.students.map(s => s.id === sId ? { ...s, grades: { ...s.grades, [colId]: status } } : s);
                    updateClassInDb({ ...cls, students: updatedStudents });
                }
                setActiveCell(null);
            };

            const goHome = () => { setView('home'); setSelectedClass(null); setSelectedStudentForView(null); };
            const openClass = (cls) => { setSelectedClass(cls); setView('class-detail'); };
            const openStudent = (std) => { setSelectedStudentForView(std); setView('student-detail'); };

            const handleTopicBulkAction = (action, classId, topicId) => {
                setActiveTopicMenu(null);
                if (!isTeacherMode) return;
                const cls = classes.find(c => c.id === classId); if (!cls) return;

                if (action === 'delete') {
                    setConfirmModal({ message: "Konuyu silmek istediğine emin misin?", type: 'danger', onConfirm: () => { updateClassInDb({ ...cls, topics: cls.topics.filter(t => t.id !== topicId) }); setConfirmModal(null); } });
                    return;
                }
                const topic = cls.topics.find(t => t.id === topicId);
                if (!topic?.subColumns?.length) { alert("Kaynak bulunamadı!"); return; }

                setConfirmModal({
                    message: `Tüm kaynaklar güncellenecek.`, type: 'info', onConfirm: () => {
                        const targetColIds = topic.subColumns.map(sc => sc.id);
                        const updatedStudents = cls.students.map(std => {
                            const newGrades = { ...std.grades };
                            targetColIds.forEach(colId => newGrades[colId] = action);
                            return { ...std, grades: newGrades };
                        });
                        updateClassInDb({ ...cls, students: updatedStudents });
                        setConfirmModal(null);
                    }
                });
            };

            const deleteColumn = (classId, topicId, colId) => { setActiveColMenu(null); setConfirmModal({ message: "Kaynağı silmek istediğine emin misin?", type: 'danger', onConfirm: () => { const cls = classes.find(c => c.id === classId); if (cls) { const updatedTopics = cls.topics.map(t => { if (t.id !== topicId) return t; return { ...t, subColumns: t.subColumns.filter(c => c.id !== colId) }; }); updateClassInDb({ ...cls, topics: updatedTopics }); } setConfirmModal(null); } }); };

            const StatusBadge = ({ status }) => {
                const opt = STATUS_OPTIONS.find(o => o.id === status) || STATUS_OPTIONS[3];
                const Icon = opt.icon;
                return (
                    <div className={`flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg border ${opt.bg} ${opt.color} ${opt.border} w-full shadow-sm`}>
                        <Icon size={14} strokeWidth={2.5} />
                        <span className="text-[10px] font-bold truncate">{opt.label}</span>
                    </div>
                );
            };

            if (loading) return <div className="flex h-screen items-center justify-center bg-slate-50 text-indigo-600"><Loader2 className="animate-spin" size={48}/></div>;

            return (
                <div className="min-h-screen pb-20 relative">
                    
                    {/* --- HEADER --- */}
                    <header className="bg-white/80 backdrop-blur-md border-b border-slate-200 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col items-center gap-2">
                            <div className="flex items-center gap-3 w-full justify-between">
                                {!isTeacherMode && view !== 'home' ? (
                                    <button onClick={() => view === 'student-detail' ? setView('class-detail') : goHome()} className="p-2 bg-slate-100 rounded-full hover:bg-slate-200 text-slate-700 transition-colors">
                                        <ChevronLeft size={24} />
                                    </button>
                                ) : <div className="w-10"></div>}

                                <div className="text-center">
                                    <h1 className="text-2xl md:text-3xl font-black tracking-tight text-slate-800 flex items-center justify-center gap-2">
                                        <GraduationCap className="text-indigo-600" /> BERKANT HOCA
                                    </h1>
                                    <p className="text-[10px] md:text-xs font-bold text-slate-400 tracking-[0.2em] uppercase">Eğitim & Ödev Takip Platformu</p>
                                </div>

                                <div className="flex items-center gap-2 w-10 justify-end">
                                    {isTeacherMode ? (
                                        <>
                                            <button onClick={() => setShowLibraryManager(true)} className="p-2 text-slate-500 hover:text-indigo-600 bg-white hover:bg-indigo-50 rounded-full transition-colors"><Library size={20}/></button>
                                            <button onClick={() => setIsTeacherMode(false)} className="p-2 text-rose-500 hover:bg-rose-50 rounded-full"><Unlock size={20}/></button>
                                        </>
                                    ) : (
                                        <button onClick={() => setShowPinModal(true)} className="p-2 text-slate-400 hover:text-indigo-600 hover:bg-slate-100 rounded-full"><Lock size={20}/></button>
                                    )}
                                </div>
                            </div>
                            
                            <div className="text-center max-w-lg mx-auto mt-1 opacity-80 hover:opacity-100 transition-opacity">
                                <p className="text-xs text-slate-500 italic">"{dailyQuote.text}"</p>
                                <p className="text-[10px] text-indigo-600 font-bold mt-0.5">— {dailyQuote.author}</p>
                            </div>
                        </div>
                    </header>

                    {/* --- COUNTDOWN --- */}
                    <CountdownTimer />

                    {/* --- DUYURU --- */}
                    <div className="max-w-6xl mx-auto px-4 mt-6">
                        <div className="bg-white rounded-2xl p-1 shadow-md border border-slate-200 relative overflow-hidden group">
                            <div className="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-indigo-500 to-purple-500"></div>
                            <div className="bg-white p-4 rounded-xl flex items-start gap-4">
                                <div className="bg-gradient-to-br from-indigo-500 to-purple-500 p-2 rounded-lg text-white shadow-lg shadow-indigo-200"><Megaphone size={20}/></div>
                                <div className="flex-1">
                                    <h3 className="text-sm font-bold text-slate-800 mb-1">Duyurular</h3>
                                    {isEditingAnnouncement ? (
                                        <div className="mt-2">
                                            <textarea className="w-full p-2 bg-slate-50 border border-slate-200 rounded text-sm text-slate-700 focus:border-indigo-500 outline-none" rows={3} value={tempAnnouncement} onChange={(e) => setTempAnnouncement(e.target.value)}/>
                                            <div className="flex justify-end gap-2 mt-2">

                        <div className="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-8 w-full max-w-xs text-center modal-anim relative overflow-hidden shadow-2xl">
                                <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-indigo-500 to-purple-500"></div>
                                <div className="bg-indigo-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6 text-indigo-600"><Lock size={32}/></div>
                                <h3 className="text-xl font-black text-slate-800 mb-6 tracking-wide">YÖNETİCİ GİRİŞİ</h3>
                                <input autoFocus type="password" className="w-full text-center text-3xl font-mono tracking-widest p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-indigo-500 outline-none mb-6 text-slate-800" placeholder="****" value={pinInput} onChange={(e) => setPinInput(e.target.value)} onKeyDown={(e) => { if(e.key==='Enter'){ verifyPin(); } }} />
                                <button onClick={verifyPin} className="w-full py-3.5 text-white bg-indigo-600 rounded-xl font-bold mb-4 hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all">GİRİŞ YAP</button>
                                <button onClick={() => setShowPinModal(false)} className="text-slate-400 text-sm font-bold hover:text-slate-600">Vazgeç</button>
                            </div>
                        </div>
                    )}

                    {/* Şifre Değiştirme Modalı */}
                    {showChangePinModal && (
                        <div className="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-8 w-full max-w-xs text-center modal-anim shadow-2xl">
                                <h3 className="text-xl font-black text-slate-800 mb-6 tracking-wide">Şifre Değiştir</h3>
                                <input autoFocus type="text" className="w-full text-center text-2xl tracking-widest p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-indigo-500 outline-none mb-6 text-slate-800" placeholder="Yeni Pin" value={newPin} onChange={(e) => setNewPin(e.target.value)} />
                                <button onClick={updatePinFn} className="w-full py-3.5 text-white bg-emerald-600 rounded-xl font-bold mb-4 hover:bg-emerald-700 shadow-lg shadow-emerald-200 transition-all">GÜNCELLE</button>
                                <button onClick={() => setShowChangePinModal(false)} className="text-slate-400 text-sm font-bold hover:text-slate-600">İptal</button>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HomeworkTracker />);
    </script>
</body>
</html>
