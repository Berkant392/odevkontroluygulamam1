        import React, { useState, useEffect, useRef } from 'react';

        };

        const LIBRARY_TYPES = { EXCUSE: 'excuse', TOPIC: 'topic', SOURCE: 'source' };

        // =======================================================================
        // === 4. YARDIMCI VERİLER VE FONKSİYONLAR (SABİTLER, UTILS) =============
        // =======================================================================
        const MOTIVATIONAL_QUOTES = [
            { text: "Başarı, her gün tekrarlanan küçük çabaların toplamıdır.", author: "Robert Collier" },
            { text: "Gelecek, bugünden ona hazırlananlara aittir.", author: "Malcolm X" },
            { text: "Bir şeyi başarmak için önce ona inanmalısın.", author: "Nikos Kazancakis" },
            { text: "Eğitim, dünyayı değiştirmek için kullanabileceğiniz en güçlü silahtır.", author: "Nelson Mandela" },
            { text: "Düşlerini gerçekleştirmek istiyorsan uyanmalısın.", author: "J.M. Power" }
        ];

        // EKSİKSİZ TEMA LİSTESİ (text ve tag eklendi)
        const TOPIC_THEMES = [
            { main: 'bg-indigo-100 text-indigo-900 border-indigo-200', sub: 'bg-indigo-50/80 text-indigo-800 border-indigo-100', cell: 'bg-indigo-50/20 border-indigo-50', btn: 'hover:bg-indigo-200 text-indigo-600', border: 'border-indigo-300', tag: 'bg-indigo-500', text: 'text-indigo-900' },
            { main: 'bg-rose-100 text-rose-900 border-rose-200', sub: 'bg-rose-50/80 text-rose-800 border-rose-100', cell: 'bg-rose-50/20 border-rose-50', btn: 'hover:bg-rose-200 text-rose-600', border: 'border-rose-300', tag: 'bg-rose-500', text: 'text-rose-900' },
            { main: 'bg-emerald-100 text-emerald-900 border-emerald-200', sub: 'bg-emerald-50/80 text-emerald-800 border-emerald-100', cell: 'bg-emerald-50/20 border-emerald-50', btn: 'hover:bg-emerald-200 text-emerald-600', border: 'border-emerald-300', tag: 'bg-emerald-500', text: 'text-emerald-900' },
            { main: 'bg-amber-100 text-amber-900 border-amber-200', sub: 'bg-amber-50/80 text-amber-800 border-amber-100', cell: 'bg-amber-50/20 border-amber-50', btn: 'hover:bg-amber-200 text-amber-600', border: 'border-amber-300', tag: 'bg-amber-500', text: 'text-amber-900' },
            { main: 'bg-sky-100 text-sky-900 border-sky-200', sub: 'bg-sky-50/80 text-sky-800 border-sky-100', cell: 'bg-sky-50/20 border-sky-50', btn: 'hover:bg-sky-200 text-sky-600', border: 'border-sky-300', tag: 'bg-sky-500', text: 'text-sky-900' },
        ];

        const STATUS_OPTIONS = [
            { id: 'assigned', label: 'Verildi', icon: Clock, color: 'text-amber-500', bg: 'bg-amber-50', border: 'border-amber-200' },
            { id: 'done', label: 'Yapıldı', icon: CheckCircle, color: 'text-emerald-500', bg: 'bg-emerald-50', border: 'border-emerald-200' },
            { id: 'missing', label: 'Eksik', icon: XCircle, color: 'text-rose-500', bg: 'bg-rose-50', border: 'border-rose-200' },
            { id: 'exempt', label: 'Muaf', icon: MinusCircle, color: 'text-slate-400', bg: 'bg-slate-50', border: 'border-slate-200' },
        ];

        const formatDate = (dateString) => { if (!dateString) return ""; return new Date(dateString).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }); };
        const generatePassword = () => { const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ'; let pwd = ''; for (let i = 0; i < 6; i++) { pwd += chars.charAt(Math.floor(Math.random() * chars.length)); } return pwd; };
        const generateUsername = (name) => { const trMap = { 'ç':'c', 'ğ':'g', 'ı':'i', 'i':'i', 'ö':'o', 'ş':'s', 'ü':'u', 'Ç':'C', 'Ğ':'G', 'İ':'I', 'Ö':'O', 'Ş':'S', 'Ü':'U' }; let baseName = name.toLowerCase().replace(/[çğıiöşüÇĞİÖŞÜ]/g, m => trMap[m] || m).replace(/[^a-z0-9]/g, '.').replace(/\.+/g, '.').replace(/^\.|\.$/g, ''); return `${baseName}.${Math.floor(100 + Math.random() * 900)}`; };
        const generateId = (p) => `${p}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        const isOverdue = (d) => d ? new Date(d) < new Date(new Date().setHours(0,0,0,0)) : false;

        const calculateStats = (students, topics) => {
            if (!students || !topics) return { percentage: 0, atRisk: [] };
            let total = 0, completed = 0; const atRisk = [];
            const allColIds = topics.flatMap(t => t.subColumns.map(c => c.id));
            if (allColIds.length === 0) return { percentage: 0, atRisk: [] };
            students.forEach(std => {
                let sTotal = 0, sComp = 0;
                allColIds.forEach(id => { sTotal++; if (std.grades?.[id] === 'done') sComp++; });
                total += sTotal; completed += sComp;
                if (sTotal > 0 && (sComp / sTotal) < 0.5) atRisk.push({ name: std.name, rate: Math.round((sComp/sTotal)*100) });
            });
            return { percentage: total === 0 ? 0 : Math.round((completed / total) * 100), atRisk };
        };

        // Hooks: Pencere genişliğini dinleme (Responsive için)
        const useWindowSize = () => {
            const [windowSize, setWindowSize] = useState({ width: undefined, height: undefined });
            useEffect(() => {
                function handleResize() { setWindowSize({ width: window.innerWidth, height: window.innerHeight }); }
                window.addEventListener("resize", handleResize);
                handleResize();
                return () => window.removeEventListener("resize", handleResize);
            }, []);
            return windowSize;
        };

        // =======================================================================
        // === 5. ALT BİLEŞENLER (Sub-Components) ================================
        // =======================================================================
        const CountdownTimer = () => {
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0, progressDays: 0, progressHours: 0, progressMinutes: 0, progressSeconds: 0 });
            useEffect(() => {
                const targetDate = new Date('2026-06-20T00:00:00');
                const startDate = new Date('2025-06-20T00:00:00');
                const totalDuration = targetDate - startDate;
                const timer = setInterval(() => {
                    const now = new Date();
                    const difference = targetDate - now;
                    const elapsed = now - startDate;
                    if (difference < 0) { clearInterval(timer); return; }
                    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                    const minutes = Math.floor((difference / 1000 / 60) % 60);
                    const seconds = Math.floor((difference / 1000) % 60);
                    const progressDays = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
                    const progressHours = (hours / 24) * 100;
                    const progressMinutes = (minutes / 60) * 100;
                    const progressSeconds = (seconds / 60) * 100;
                    setTimeLeft({ days, hours, minutes, seconds, progressDays, progressHours, progressMinutes, progressSeconds });
                }, 1000);
                return () => clearInterval(timer);
            }, []);
            const CircularProgress = ({ value, max, color, strokeColor, label }) => {
                const radius = 22; const circumference = 2 * Math.PI * radius; const offset = circumference - (value / 100) * circumference;
                return (
                    <div className="flex flex-col items-center">
                        <div className="relative w-14 h-14 md:w-20 md:h-20 drop-shadow-sm">
                            <svg className="w-full h-full transform -rotate-90" viewBox="0 0 50 50">
                                <circle className="text-slate-100" strokeWidth="4" stroke="currentColor" fill="transparent" r={radius} cx="25" cy="25"/>
                                <circle className={`${strokeColor} transition-all duration-1000 ease-linear drop-shadow-md`} strokeWidth="4" strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round" stroke="currentColor" fill="transparent" r={radius} cx="25" cy="25" />
                            </svg>
                            <div className="absolute top-0 left-0 w-full h-full flex flex-col items-center justify-center">
                                <span className={`text-base md:text-xl font-black ${strokeColor}`}>{max}</span>
                            </div>
                        </div>
                        <span className="text-[10px] md:text-xs font-black text-slate-500 mt-2 uppercase tracking-widest">{label}</span>
                    </div>
                );
            };
            return (
                <div className="max-w-7xl mx-auto px-4 mt-6 animate-fade-in-up">
                    <div className="bg-white rounded-[2rem] shadow-soft border border-slate-100 p-6 relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-6">
                        <div className="absolute -right-10 -top-10 text-indigo-50/50 rotate-12"><CalendarDays size={150} /></div>
                        <div className="relative z-10 flex flex-col items-center md:items-start">
                            <div className="flex items-center gap-2 mb-2">
                                <div className="p-2 bg-indigo-100 rounded-xl text-indigo-600"><GraduationCap size={20} /></div>
                                <h3 className="text-sm md:text-base font-black text-slate-800 uppercase tracking-widest">YKS Hedefine Kalan Zaman</h3>
                            </div>
                            <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100 shadow-sm">20 Haziran 2026</span>
                        </div>
                        <div className="relative z-10 flex justify-center gap-4 md:gap-8">
                            <CircularProgress value={timeLeft.progressDays} max={timeLeft.days} strokeColor="text-amber-500" label="GÜN" />
                            <CircularProgress value={timeLeft.progressHours} max={timeLeft.hours} strokeColor="text-sky-500" label="SAAT" />
                            <CircularProgress value={timeLeft.progressMinutes} max={timeLeft.minutes} strokeColor="text-emerald-500" label="DAKİKA" />
                            <CircularProgress value={timeLeft.progressSeconds} max={timeLeft.seconds} strokeColor="text-rose-500" label="SANİYE" />
                        </div>
                    </div>
                </div>
            );
        };

        const StatusBadge = ({ status, hasNote }) => {
            const opt = STATUS_OPTIONS.find(o => o.id === status) || STATUS_OPTIONS[3];

        // MOBİL İÇİN ÖĞRENCİ KART BİLEŞENİ
        const MobileStudentCard = ({ student, cls, updateGrade, onOpenNote, onEditStudent, onDeleteStudent, onPrintReport }) => {
            const [expanded, setExpanded] = useState(false);
            const studentStats = calculateStats([student], cls.topics);
            
            return (
                <div className="bg-white rounded-2xl shadow-soft border border-slate-200 overflow-hidden mb-4 transition-all duration-300">
                    <div className="p-4 flex items-center justify-between cursor-pointer bg-slate-50/50 hover:bg-slate-50 transition-colors" onClick={() => setExpanded(!expanded)}>
                        <div className="flex items-center gap-3">

                        </div>
                        <div className="flex items-center gap-2">
                             <div className={`p-1 rounded-full text-slate-400 transition-transform duration-300 ${expanded ? 'rotate-180' : ''}`}>
                                <ChevronDown size={20} />

                        </div>
                    </div>

                    {expanded && (
                        <div className="p-4 border-t border-slate-100 bg-white">

                                                    ${assistantSelectedStudentId === student.id ? 'bg-indigo-50 border-indigo-500 shadow-md' : 'border-transparent hover:bg-slate-50'}`}
                                            >
                                                <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shrink-0
                                                    ${assistantSelectedStudentId === student.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}`}>
                                                    {student.name.charAt(0)}
                                                </div>
                                                <span className={`font-bold text-sm truncate ${assistantSelectedStudentId === student.id ? 'text-indigo-900' : 'text-slate-700'}`}>
                                                    {student.name}
                                                </span>
                                            </button>
                                        ))}
                                        {assistantFoundStudents.length === 0 && <div className="text-xs text-slate-400 text-center py-4">Öğrenci bulunamadı.</div>}
                                    </div>

                                    {/* Sağ Kolon: Ödevler ve Hızlı İşlem */}
                                    <div className="w-full md:w-2/3 overflow-y-auto p-4 md:p-6">
                                        
                                        {assistantSelectedStudentId ? (
                                            <div className="space-y-6">
                                                <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Ödevler ve Kaynaklar</div>
                                                {assistantFoundTopics.map(topic => (
                                                    <div key={topic.id} className="bg-white rounded-3xl border border-slate-200 p-5 shadow-sm">
                                                        <h4 className="font-black text-slate-800 text-lg mb-4 border-b border-slate-100 pb-3 flex items-center gap-2">
                                                            <div className="w-2 h-6 bg-indigo-500 rounded-full"></div>
                                                            {topic.title}
                                                        </h4>
                                                        <div className="space-y-4">
                                                            {topic.subColumns.map(col => {
                                                                const studentData = activeRiskClass.students.find(s => s.id === assistantSelectedStudentId);
                                                                const currentDbGrade = studentData?.grades?.[col.id] || 'exempt';
                                                                const currentDbNote = studentData?.assignmentNotes?.[col.id] || '';
                                                                
                                                                const draftGrade = assistantDraftGrades[assistantSelectedStudentId]?.[col.id];
                                                                const draftNote = assistantDraftNotes[assistantSelectedStudentId]?.[col.id];
                                                                
                                                                const displayGrade = draftGrade !== undefined ? draftGrade : currentDbGrade;
                                                                const displayNote = draftNote !== undefined ? draftNote : currentDbNote;
                                                                
                                                                const isChanged = (draftGrade !== undefined && draftGrade !== currentDbGrade) || (draftNote !== undefined && draftNote !== currentDbNote);

                                                                return (
                                                                    <div key={col.id} className={`flex flex-col gap-3 p-4 rounded-2xl transition-all ${isChanged ? 'bg-amber-50/50 border border-amber-200 shadow-sm' : 'bg-slate-50 border border-slate-100'}`}>
                                                                        <div className="text-sm font-bold text-slate-700">{col.title}</div>
                                                                        
                                                                        <div className="grid grid-cols-4 gap-2">
                                                                            {STATUS_OPTIONS.map(opt => (
                                                                                <button 
                                                                                    key={opt.id}
                                                                                    onClick={() => handleDraftGradeChange(assistantSelectedStudentId, col.id, opt.id)}
                                                                                    className={`flex flex-col items-center justify-center p-2 rounded-xl border-2 transition-all 
                                                                                        ${displayGrade === opt.id ? `${opt.bg} ${opt.color} ${opt.border} shadow-sm scale-105` : 'bg-white text-slate-400 border-slate-100 hover:border-slate-300'}`}
                                                                                >
                                                                                    <opt.icon size={18} className="mb-1" strokeWidth={2.5} />
                                                                                    <span className="text-[10px] font-black uppercase">{opt.label}</span>
                                                                                </button>
                                                                            ))}
                                                                        </div>

                                                                        <div className="relative mt-1">
                                                                            <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none">
                                                                                <StickyNote size={14} className="text-slate-400"/>
                                                                            </div>
                                                                            <input 
                                                                                type="text" 
                                                                                placeholder="Öğretmen notu ekle..." 
                                                                                className="w-full text-xs pl-9 pr-3 py-2.5 bg-white border border-slate-200 rounded-xl outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all font-medium text-slate-700 placeholder:text-slate-400"
                                                                                value={displayNote}
                                                                                onChange={(e) => handleDraftNoteChange(assistantSelectedStudentId, col.id, e.target.value)}
                                                                            />
                                                                        </div>
                                                                    </div>
                                                                )
                                                            })}
                                                            {topic.subColumns.length === 0 && <div className="text-xs text-slate-400 text-center py-2">Kaynak yok.</div>}
                                                        </div>
                                                    </div>
                                                ))}
                                                {assistantFoundTopics.length === 0 && <div className="text-xs text-slate-400 text-center py-8 bg-white rounded-2xl border border-slate-200">Konu bulunamadı.</div>}
                                            </div>
                                        ) : (
                                            <div className="flex flex-col h-full items-center justify-center text-slate-400 bg-white rounded-3xl border border-dashed border-slate-300 p-8">
                                                <User size={48} className="mb-4 text-slate-200" />
                                                <p className="text-sm font-bold text-slate-500">Öğrenci Seçilmedi</p>
                                                <p className="text-xs mt-1 text-center">İşlem yapmak için soldaki listeden bir öğrenci seçin.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Footer / Aksiyonlar */}
                                <div className="p-4 md:p-6 border-t border-slate-200 bg-white flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div className="text-xs font-bold w-full md:w-auto text-center md:text-left">
                                        {Object.keys(assistantDraftGrades).length > 0 || Object.keys(assistantDraftNotes).length > 0 ? (
                                            <span className="text-amber-600 bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200 flex items-center justify-center md:justify-start gap-1.5">
                                                <AlertTriangle size={14}/> Kaydedilmeyi bekleyen değişiklikler var
                                            </span>
                                        ) : (
                                            <span className="text-slate-400">Değişiklik yapılmadı</span>
                                        )}
                                    </div>
                                    <div className="flex gap-3 w-full md:w-auto">
                                        <button onClick={() => { setShowAssistantModal(false); setAssistantDraftGrades({}); setAssistantDraftNotes({}); }} className="flex-1 md:flex-none px-6 py-3 font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors text-sm">
                                            İptal
                                        </button>
                                        <button 
                                            onClick={applyAssistantDrafts} 
                                            disabled={Object.keys(assistantDraftGrades).length === 0 && Object.keys(assistantDraftNotes).length === 0}
                                            className={`flex-1 md:flex-none px-8 py-3 rounded-xl font-black text-white shadow-lg transition-all text-sm flex items-center justify-center gap-2
                                                ${(Object.keys(assistantDraftGrades).length > 0 || Object.keys(assistantDraftNotes).length > 0) ? 'bg-indigo-600 hover:bg-indigo-700 hover:-translate-y-0.5 shadow-indigo-500/30' : 'bg-slate-300 cursor-not-allowed'}`}
                                        >
                                            <Save size={18} /> DEĞİŞİKLİKLERİ KAYDET
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Not, Kütüphane, Onay ve Risk Modalları */}
                    {showCellNoteModal && (<div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4"><div className="bg-white rounded-3xl w-full max-w-sm shadow-2xl modal-anim overflow-hidden border border-slate-200"><div className="bg-gradient-to-r from-amber-50 to-orange-50 p-5 border-b border-amber-100 flex items-center justify-between"><div className="flex items-center gap-3"><div className="bg-white p-2 rounded-lg shadow-sm"><StickyNote className="text-amber-500" size={20}/></div><h3 className="font-black text-amber-900 text-lg">Öğretmen Notu</h3></div><div className="flex bg-white rounded-lg p-1 shadow-sm border border-amber-100"><button onClick={() => setUseNoteLibrary(false)} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${!useNoteLibrary ? 'bg-amber-500 text-white' : 'text-slate-500 hover:bg-slate-50'}`}>Yaz</button><button onClick={() => setUseNoteLibrary(true)} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${useNoteLibrary ? 'bg-amber-500 text-white' : 'text-slate-500 hover:bg-slate-50'}`}>Kütüphane</button></div></div><div className="p-6 bg-slate-50">{useNoteLibrary ? (<div className="h-40 overflow-y-auto border border-slate-200 rounded-2xl bg-white shadow-inner p-2">{libraryItems.filter(i => i.type === LIBRARY_TYPES.EXCUSE).map(item => (<button key={item.id} onClick={() => setNoteInput(item.text)} className={`w-full text-left p-3 text-sm rounded-xl mb-1 transition-colors flex justify-between items-center ${noteInput === item.text ? 'bg-amber-50 border border-amber-200 text-amber-800 font-bold' : 'hover:bg-slate-50 text-slate-600 border border-transparent'}`}><span>{item.text}</span> {noteInput === item.text && <CheckCircle size={16} className="text-amber-500"/>}</button>))}{libraryItems.filter(i => i.type === LIBRARY_TYPES.EXCUSE).length === 0 && <p className="text-center text-sm font-medium text-slate-400 py-8">Kayıtlı not bulunamadı.</p>}</div>) : (<textarea className="w-full p-4 bg-white border border-slate-200 rounded-2xl focus:border-amber-400 focus:ring-4 focus:ring-amber-50 outline-none text-sm resize-none shadow-inner font-medium text-slate-700" rows={4} placeholder="Öğrenci için notunuzu buraya yazın..." value={noteInput} onChange={(e) => setNoteInput(e.target.value)} autoFocus></textarea>)}</div><div className="p-4 bg-white border-t border-slate-100 flex justify-end gap-3">{noteInput && <button onClick={deleteCellNote} className="px-5 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-sm font-bold transition-colors">Sil</button>}<button onClick={() => setShowCellNoteModal(false)} className="px-5 py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 rounded-xl transition-colors">İptal</button><button onClick={saveCellNote} className="px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-sm font-bold shadow-md shadow-amber-200 transition-transform hover:-translate-y-0.5">Kaydet</button></div></div></div>)}
                    
                    {modalType && (<div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4"><div className="bg-white border border-slate-200 rounded-3xl w-full max-w-sm overflow-hidden modal-anim shadow-2xl"><div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50"><h3 className="font-black text-lg text-slate-800 flex items-center gap-2">{modalType.startsWith('edit') ? <Pencil size={20} className="text-indigo-600"/> : <Plus size={20} className="text-indigo-600"/>} {modalType.startsWith('edit') ? 'Düzenle' : (modalType === 'class' ? 'Yeni Sınıf' : (modalType === 'topic' ? 'Yeni Ödev' : 'Yeni Kaynak'))}</h3><button onClick={closeModal} className="text-slate-400 hover:text-rose-600 bg-white p-1.5 rounded-full shadow-sm transition-colors"><X size={20}/></button></div><div className="p-6 flex flex-col gap-5">{!modalType.startsWith('edit') && modalType !== 'class' && (<div className="flex bg-slate-100 p-1 rounded-xl"><button onClick={() => setUseLibrary(false)} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${!useLibrary ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}>Yeni Yaz</button><button onClick={() => setUseLibrary(true)} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${useLibrary ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}>Kütüphaneden Seç</button></div>)}{useLibrary ? (<div className="max-h-52 overflow-y-auto border border-slate-200 rounded-2xl bg-slate-50/50 p-2 shadow-inner">{libraryItems.filter(i => i.type === (modalType === 'topic' ? LIBRARY_TYPES.TOPIC : LIBRARY_TYPES.SOURCE)).map(item => (<button key={item.id} onClick={() => { setModalInputVal(item.text); if(item.date) setModalDateVal(item.date); }} className={`w-full text-left p-3 text-sm rounded-xl mb-1 transition-colors flex flex-col gap-1 ${modalInputVal === item.text ? 'bg-indigo-50 border border-indigo-200 text-indigo-700 font-bold' : 'hover:bg-white text-slate-600 border border-transparent'}`}><span>{item.text}</span>{item.date && modalType === 'topic' && <span className="text-[10px] text-slate-400 flex items-center gap-1 font-medium"><Calendar size={12}/> {item.date}</span>}</button>))}{libraryItems.filter(i => i.type === (modalType === 'topic' ? LIBRARY_TYPES.TOPIC : LIBRARY_TYPES.SOURCE)).length ===0 && <p className="p-6 text-sm font-medium text-center text-slate-400">Kütüphanede kayıtlı veri yok.</p>}</div>) : (<input autoFocus type="text" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 outline-none text-slate-800 placeholder:text-slate-400 font-bold" placeholder="İsim giriniz..." value={modalInputVal} onChange={(e) => setModalInputVal(e.target.value)} />)}{(modalType === 'topic' || modalType === 'edit-topic') && (<div className="flex flex-col gap-2"><label className="text-xs font-black text-slate-500 uppercase tracking-widest pl-1">Son Teslim Tarihi</label><input type="date" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-700 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 outline-none" value={modalDateVal} onChange={(e) => setModalDateVal(e.target.value)} /></div>)}</div><div className="p-5 bg-white border-t border-slate-100 flex gap-3"><button onClick={closeModal} className="flex-1 py-3 text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">İptal</button><button onClick={handleModalSubmit} className="flex-1 py-3 rounded-xl font-black text-white bg-indigo-600 hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-transform hover:-translate-y-0.5">Kaydet</button></div></div></div>)}
                    
                    {showLibraryManager && (<div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4"><div className="bg-white border border-slate-200 rounded-3xl w-full max-w-lg flex flex-col max-h-[85vh] modal-anim shadow-2xl"><div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50"><h3 className="font-bold text-slate-800 flex gap-3 items-center"><div className="bg-indigo-100 p-2 rounded-lg"><Library size={20} className="text-indigo-600"/></div> Kütüphane Yönetimi</h3><button onClick={() => setShowLibraryManager(false)} className="text-slate-400 hover:text-rose-600 bg-white p-1.5 rounded-full shadow-sm transition-colors"><X size={20}/></button></div><div className="p-4 bg-white"><div className="flex bg-slate-100 p-1.5 rounded-xl"><button onClick={() => setLibraryCategory(LIBRARY_TYPES.TOPIC)} className={`flex-1 py-2 rounded-lg text-xs md:text-sm font-bold transition-all ${libraryCategory === LIBRARY_TYPES.TOPIC ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Ödevler</button><button onClick={() => setLibraryCategory(LIBRARY_TYPES.SOURCE)} className={`flex-1 py-2 rounded-lg text-xs md:text-sm font-bold transition-all ${libraryCategory === LIBRARY_TYPES.SOURCE ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Kaynaklar</button><button onClick={() => setLibraryCategory(LIBRARY_TYPES.EXCUSE)} className={`flex-1 py-2 rounded-lg text-xs md:text-sm font-bold transition-all ${libraryCategory === LIBRARY_TYPES.EXCUSE ? 'bg-white text-amber-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Notlar</button></div></div><div className="p-5 bg-slate-50 border-b border-slate-100 flex flex-col gap-3"><div className="flex gap-2"><input type="text" className="flex-1 p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:border-indigo-500 outline-none shadow-sm" placeholder="Yeni içerik yazın..." value={libraryInput} onChange={(e) => setLibraryInput(e.target.value)} onKeyDown={(e) => { if(e.key === 'Enter') {addLibraryItem(libraryInput); setLibraryInput('');} }} /><button onClick={() => { addLibraryItem(libraryInput); setLibraryInput(''); }} className="bg-indigo-600 text-white px-5 rounded-xl hover:bg-indigo-700 shadow-md font-bold transition-transform hover:-translate-y-0.5">Ekle</button></div>{libraryCategory === LIBRARY_TYPES.TOPIC && (<div className="flex items-center gap-3 bg-white p-2 rounded-xl border border-slate-200"><Calendar size={16} className="text-slate-400 ml-2"/><input type="date" className="flex-1 bg-transparent text-sm font-bold text-slate-600 outline-none" value={libraryDate} onChange={(e) => setLibraryDate(e.target.value)}/></div>)}</div><div className="flex-1 overflow-y-auto p-4 bg-slate-50/50 space-y-2">{libraryItems.filter(i => i.type === libraryCategory).map(item => (<div key={item.id} className="flex justify-between items-center p-4 bg-white border border-slate-100 shadow-sm rounded-2xl group hover:border-indigo-200 transition-colors"><div className="flex flex-col"><span className="text-sm font-bold text-slate-700">{item.text}</span>{item.date && <span className="text-xs text-slate-400 font-medium flex items-center gap-1.5 mt-1"><Calendar size={12}/> {item.date}</span>}</div><button onClick={() => deleteLibraryItem(item.id)} className="text-slate-300 hover:text-rose-500 hover:bg-rose-50 p-2 rounded-lg transition-colors"><Trash2 size={18}/></button></div>))}{libraryItems.filter(i => i.type === libraryCategory).length === 0 && <div className="flex flex-col items-center justify-center h-32 text-slate-400"><Library size={32} className="mb-2 opacity-50"/><span className="text-sm font-medium">Bu kategori boş.</span></div>}</div></div></div>)}
                    
                    {confirmModal && (<div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4"><div className="bg-white border border-slate-200 rounded-3xl p-8 max-w-sm w-full text-center modal-anim shadow-2xl"><div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner ${confirmModal.type === 'danger' ? 'bg-rose-100 text-rose-600' : 'bg-indigo-100 text-indigo-600'}`}><AlertTriangle size={32} /></div><p className="text-slate-800 text-lg font-black mb-8 leading-tight">{confirmModal.message}</p><div className="flex gap-3"><button onClick={() => setConfirmModal(null)} className="flex-1 py-3.5 rounded-xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200 transition-colors">İptal Et</button><button onClick={confirmModal.onConfirm} className={`flex-1 py-3.5 rounded-xl text-white font-black shadow-lg transition-transform hover:-translate-y-0.5 ${confirmModal.type === 'danger' ? 'bg-rose-600 hover:bg-rose-700 shadow-rose-200' : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-200'}`}>Onayla</button></div></div></div>)}
                    {showRiskModal && activeRiskClass && (<div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4"><div className="bg-white border border-slate-200 rounded-2xl w-full max-w-sm overflow-hidden modal-anim shadow-2xl"><div className="bg-rose-50 p-4 border-b border-rose-100 flex justify-between items-center"><h3 className="font-bold text-rose-800 flex items-center gap-2"><AlertOctagon size={18}/> Risk Analizi</h3><button onClick={() => setShowRiskModal(false)} className="text-rose-400 hover:text-rose-600"><X size={20}/></button></div><div className="p-6"><p className="text-xs text-slate-500 mb-4 font-medium">Bu sınıfta ödev yapma oranı %50'nin altında olan öğrenciler:</p><div className="grid grid-cols-2 gap-3">{calculateStats(activeRiskClass.students, activeRiskClass.topics).atRisk.length > 0 ? (calculateStats(activeRiskClass.students, activeRiskClass.topics).atRisk.map((s, i) => (<div key={i} className="bg-white p-3 rounded-xl border border-rose-100 shadow-sm flex flex-col items-center"><span className="font-bold text-slate-700 text-sm text-center">{s.name}</span><span className="text-rose-600 font-black text-lg mt-1">%{s.rate}</span></div>))) : (<p className="col-span-2 text-center text-sm text-emerald-600 font-bold py-4">Harika! Riskli öğrenci yok.</p>)}</div></div></div></div>)}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
