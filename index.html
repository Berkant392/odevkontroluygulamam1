<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- ÖNEMLİ: Zoom yapılabilmesi için user-scalable=yes yapıldı ve maximum-scale artırıldı -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Berkant Hoca - Mobil Ödev Takip</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
        }
    }
    </script>

    <style>
        /* Pürüzsüz kaydırma */
        html { 
            scroll-behavior: smooth; 
            /* Yatay taşmaya izin veriyoruz, böylece sayfa genişliyor */
            overflow-x: auto; 
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* İçeriğin genişlemesine izin ver */
            min-width: 100vw;
            width: fit-content;
        }

        /* TÜM Scrollbarları Gizle (Ama kaydırma çalışsın) */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        /* Tablo hücrelerinin sıkışmasını önle */
        td, th { white-space: nowrap; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import ReactDOM from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, setDoc, onSnapshot } from 'firebase/firestore';
        import { 
            ChevronRight, ChevronDown, CheckCircle, XCircle, Clock, 
            Plus, Trash2, Lock, Unlock, Loader2, 
            MoreVertical, MinusCircle, ArrowDownToLine, UserPlus, KeyRound,
            Megaphone, Edit3, Save, X, Layout, BookOpen, AlertTriangle, GraduationCap, Quote
        } from 'lucide-react';

        const firebaseConfig = {
            apiKey: "AIzaSyDNfK49NR1dfbN0TSb35FI85huw8YJfcyQ",
            authDomain: "odevtakip-145f5.firebaseapp.com",
            projectId: "odevtakip-145f5",
            storageBucket: "odevtakip-145f5.firebasestorage.app",
            messagingSenderId: "1083778395806",
            appId: "1:1083778395806:web:c67f99e34a11e5a330958f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const COLLECTION_NAME = 'homework_tracker'; 
        const DOC_ID = 'main_list_v8_berkant_hoca'; 
        const DOC_ID_SETTINGS = 'settings'; 
        const DEFAULT_PIN = "1234"; 

        const TOPIC_THEMES = [
            { bg: 'bg-indigo-100', border: 'border-indigo-300', text: 'text-indigo-900', hover: 'hover:bg-indigo-200' },
            { bg: 'bg-rose-100', border: 'border-rose-300', text: 'text-rose-900', hover: 'hover:bg-rose-200' },
            { bg: 'bg-emerald-100', border: 'border-emerald-300', text: 'text-emerald-900', hover: 'hover:bg-emerald-200' },
            { bg: 'bg-amber-100', border: 'border-amber-300', text: 'text-amber-900', hover: 'hover:bg-amber-200' },
            { bg: 'bg-sky-100', border: 'border-sky-300', text: 'text-sky-900', hover: 'hover:bg-sky-200' },
            { bg: 'bg-fuchsia-100', border: 'border-fuchsia-300', text: 'text-fuchsia-900', hover: 'hover:bg-fuchsia-200' },
        ];

        const STUDENT_ROW_COLORS = [
            '#fce7f3', '#e0f2fe', '#dcfce7', '#fef3c7', 
            '#ede9fe', '#ffedd5', '#fae8ff', '#ecfccb'
        ];

        const STATUS_OPTIONS = [
            { id: 'assigned', label: 'Verildi', icon: Clock, color: 'text-amber-700', bg: 'bg-amber-100', border: 'border-amber-300' },
            { id: 'done', label: 'Yapıldı', icon: CheckCircle, color: 'text-green-700', bg: 'bg-green-100', border: 'border-green-300' },
            { id: 'missing', label: 'Eksik', icon: XCircle, color: 'text-red-700', bg: 'bg-red-100', border: 'border-red-300' },
            { id: 'exempt', label: 'Muaf', icon: MinusCircle, color: 'text-gray-500', bg: 'bg-gray-100', border: 'border-gray-300' },
        ];

        const MOTIVATIONAL_QUOTE = {
            text: "Başarı, her gün tekrarlanan küçük çabaların toplamıdır.",
            author: "Robert Collier"
        };

        const HomeworkTracker = () => {
            const [user, setUser] = useState(null);
            const [classes, setClasses] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isTeacherMode, setIsTeacherMode] = useState(false);
            const [dbTeacherPin, setDbTeacherPin] = useState(DEFAULT_PIN);
            const [announcement, setAnnouncement] = useState("");
            const [tempAnnouncement, setTempAnnouncement] = useState("");
            const [isEditingAnnouncement, setIsEditingAnnouncement] = useState(false);
            const [pinInput, setPinInput] = useState("");
            const [showPinModal, setShowPinModal] = useState(false);
            const [showChangePinModal, setShowChangePinModal] = useState(false);
            const [newPin, setNewPin] = useState("");
            const [newStudentName, setNewStudentName] = useState("");
            const [modalType, setModalType] = useState(null); 
            const [modalData, setModalData] = useState({}); 
            const [modalInputVal, setModalInputVal] = useState(""); 
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [studentNoteInput, setStudentNoteInput] = useState("");
            const [activeCell, setActiveCell] = useState(null); 
            const [activeColMenu, setActiveColMenu] = useState(null); 
            const [activeTopicMenu, setActiveTopicMenu] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);

            const isFirstLoad = useRef(true);

            useEffect(() => {
                const initAuth = async () => {
                try { await signInAnonymously(auth); } catch (error) { console.error(error); }
                };
                initAuth();
                return onAuthStateChanged(auth, (u) => u && setUser(u));
            }, []);

            useEffect(() => {
                if (!user) return;
                const docRef = doc(db, COLLECTION_NAME, DOC_ID);
                const unsubClasses = onSnapshot(docRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data().classes || [];
                        if (isFirstLoad.current) {
                            const closedClasses = data.map(c => ({ ...c, isOpen: false }));
                            setClasses(closedClasses);
                            isFirstLoad.current = false;
                        } else {
                            setClasses(data);
                        }
                    } else { 
                        setDoc(docRef, { classes: [] }); 
                        setClasses([]); 
                    }
                    setLoading(false);
                });

                const settingsRef = doc(db, COLLECTION_NAME, DOC_ID_SETTINGS);
                const unsubSettings = onSnapshot(settingsRef, (snap) => {
                    if (snap.exists()) {
                        const d = snap.data();
                        if (d.pin) setDbTeacherPin(d.pin);
                        if (d.announcement !== undefined) setAnnouncement(d.announcement);
                    } else {
                        setDoc(settingsRef, { pin: DEFAULT_PIN, announcement: "Hoşgeldiniz!" });
                    }
                });
                return () => { unsubClasses(); unsubSettings(); };
            }, [user]);

            const saveData = async (newData) => {
                if (!user) return;
                try {
                    const docRef = doc(db, COLLECTION_NAME, DOC_ID);
                    await setDoc(docRef, { classes: newData }, { merge: true });
                } catch (err) { console.error(err); }
            };

            const generateId = (prefix) => `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;

            const toggleClass = (id) => {
                const updated = classes.map(c => {
                    if (c.id === id) return { ...c, isOpen: !c.isOpen };
                    return c;
                });
                setClasses(updated);
            };

            const handleModalSubmit = () => {
                if (!modalInputVal.trim()) return;
                let updated = [...classes];
                if (modalType === 'class') {
                    const newCls = { id: generateId('class'), className: modalInputVal, isOpen: true, topics: [], students: [] };
                    updated = [...updated, newCls];
                } else if (modalType === 'topic') {
                    updated = updated.map(cls => {
                        if (cls.id !== modalData.classId) return cls;
                        const newTopic = { id: generateId('topic'), title: modalInputVal, subColumns: [] };
                        return { ...cls, topics: [...(cls.topics || []), newTopic] };
                    });
                } else if (modalType === 'source') {
                    updated = updated.map(cls => {
                        if (cls.id !== modalData.classId) return cls;
                        const updatedTopics = cls.topics.map(topic => {
                        if (topic.id !== modalData.topicId) return topic;
                        return { ...topic, subColumns: [...topic.subColumns, { id: generateId('col'), title: modalInputVal }] };
                        });
                        return { ...cls, topics: updatedTopics };
                    });
                }
                setClasses(updated); saveData(updated); closeModal();
            };

            const closeModal = () => { setModalType(null); setModalData({}); setModalInputVal(""); };
            const openModal = (type, data = {}) => { setModalType(type); setModalData(data); setModalInputVal(""); };

            const deleteClass = (e, id) => {
                e.stopPropagation();
                setConfirmModal({
                    message: "Sınıfı silmek istediğine emin misin?",
                    type: 'danger',
                    onConfirm: () => {
                        const updated = classes.filter(c => c.id !== id);
                        setClasses(updated); saveData(updated); setConfirmModal(null);
                    }
                });
            };

            const deleteStudent = (e, classId, sId) => {
                e.stopPropagation();
                setConfirmModal({
                    message: "Öğrenciyi silmek istediğine emin misin?",
                    type: 'danger',
                    onConfirm: () => {
                        const updated = classes.map(cls => cls.id === classId ? { ...cls, students: cls.students.filter(s => s.id !== sId) } : cls);
                        setClasses(updated); saveData(updated); setConfirmModal(null);
                    }
                });
            };

            const deleteColumn = (classId, topicId, colId) => {
                setActiveColMenu(null);
                setConfirmModal({
                    message: "Kaynağı silmek istediğine emin misin?",
                    type: 'danger',
                    onConfirm: () => {
                        const updated = classes.map(cls => {
                            if (cls.id !== classId) return cls;
                            const updatedTopics = cls.topics.map(t => {
                                if (t.id !== topicId) return t;
                                return { ...t, subColumns: t.subColumns.filter(c => c.id !== colId) };
                            });
                            return { ...cls, topics: updatedTopics };
                        });
                        setClasses(updated); saveData(updated); setConfirmModal(null);
                    }
                });
            };

            const handleTopicBulkAction = (action, classId, topicId) => {
                setActiveTopicMenu(null);
                if (!isTeacherMode) return;
                if (action === 'delete') {
                    setConfirmModal({
                        message: "Konuyu silmek istediğine emin misin?",
                        type: 'danger',
                        onConfirm: () => {
                            const updated = classes.map(cls => {
                                if (cls.id !== classId) return cls;
                                return { ...cls, topics: cls.topics.filter(t => t.id !== topicId) };
                            });
                            setClasses(updated); saveData(updated); setConfirmModal(null);
                        }
                    });
                    return;
                }
                const cls = classes.find(c => c.id === classId);
                const topic = cls?.topics.find(t => t.id === topicId);
                if (!topic?.subColumns?.length) { alert("Kaynak bulunamadı!"); return; }
                setConfirmModal({
                    message: `Tüm kaynaklar güncellenecek.`,
                    type: 'info',
                    onConfirm: () => {
                        const updated = classes.map(cls => {
                            if (cls.id !== classId) return cls;
                            const targetTopic = cls.topics.find(t => t.id === topicId);
                            const targetColIds = targetTopic.subColumns.map(sc => sc.id);
                            const updatedStudents = cls.students.map(std => {
                                const newGrades = { ...std.grades };
                                targetColIds.forEach(colId => newGrades[colId] = action);
                                return { ...std, grades: newGrades };
                            });
                            return { ...cls, students: updatedStudents };
                        });
                        setClasses(updated); saveData(updated); setConfirmModal(null);
                    }
                });
            };

            const updateGrade = (classId, studentId, colId, status) => {
                const updated = classes.map(cls => {
                    if (cls.id !== classId) return cls;
                    const updatedStudents = cls.students.map(std => {
                        if (std.id !== studentId) return std;
                        return { ...std, grades: { ...std.grades, [colId]: status } };
                    });
                    return { ...cls, students: updatedStudents };
                });
                setClasses(updated); saveData(updated); setActiveCell(null);
            };

            const addStudent = (classId) => {
                if (!newStudentName.trim()) return;
                const updated = classes.map(cls => {
                    if (cls.id !== classId) return cls;
                    return { ...cls, students: [...cls.students, { id: generateId('student'), name: newStudentName, grades: {}, privateNotes: "" }] };
                });
                setClasses(updated); saveData(updated); setNewStudentName("");
            };

            const saveStudentNote = () => {
                if (!selectedStudent) return;
                const { classId, student } = selectedStudent;
                const updated = classes.map(cls => {
                    if (cls.id !== classId) return cls;
                    const updatedStudents = cls.students.map(s => {
                        if (s.id !== student.id) return s;
                        return { ...s, privateNotes: studentNoteInput };
                    });
                    return { ...cls, students: updatedStudents };
                });
                setClasses(updated); saveData(updated); setSelectedStudent(null);
            };

            const saveAnnouncementFn = async () => { try { await setDoc(doc(db, COLLECTION_NAME, DOC_ID_SETTINGS), { announcement: tempAnnouncement }, { merge: true }); setIsEditingAnnouncement(false); } catch (e) { alert("Hata"); } };
            const updatePinFn = async () => { if (newPin.length < 4) return alert("En az 4 karakter."); await setDoc(doc(db, COLLECTION_NAME, DOC_ID_SETTINGS), { pin: newPin }, { merge: true }); setShowChangePinModal(false); setNewPin(""); alert("Şifre değişti."); };

            const StatusBadge = ({ status }) => {
                const opt = STATUS_OPTIONS.find(o => o.id === status) || STATUS_OPTIONS[3];
                const Icon = opt.icon;
                return (
                <div className={`flex items-center justify-center gap-1.5 px-2 py-1.5 rounded-lg border ${opt.bg} ${opt.color} ${opt.border} w-full h-full`}>
                    <Icon size={14} strokeWidth={2.5} />
                    <span className="text-[10px] font-bold truncate hidden md:inline">{opt.label}</span>
                </div>
                );
            };

            if (loading) return <div className="flex h-screen items-center justify-center text-indigo-600"><Loader2 className="animate-spin" size={40}/></div>;

            return (
                <div className="min-h-screen font-sans text-slate-800 pb-32 w-fit min-w-full">
                {(activeCell || activeColMenu || activeTopicMenu) && (
                    <div className="fixed inset-0 z-50 bg-black/20" onClick={() => { setActiveCell(null); setActiveColMenu(null); setActiveTopicMenu(null); }}/>
                )}
                
                {/* HEADER - Sticky değil artık, sayfa ile kaysın istenirse sticky class'ı kaldırılabilir ama kullanıcı deneyimi için sticky kalması iyidir. Ancak sayfa genişlediğinde header'ın da genişlemesi gerekir. */}
                <div className="bg-white sticky top-0 z-[60] shadow-sm border-b border-indigo-50/50 w-full min-w-max">
                    <div className="max-w-full px-4 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <div className="bg-indigo-600 text-white p-2 rounded-lg shadow-md shadow-indigo-200"><GraduationCap size={22} /></div>
                            <div>
                                <h1 className="text-lg font-black text-slate-800 leading-none">BERKANT HOCA</h1>
                                <span className="text-[10px] font-bold text-indigo-500 tracking-wider">ÖDEV TAKİP</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            {isTeacherMode && <button onClick={() => setShowChangePinModal(true)} className="p-2 text-slate-400 hover:text-indigo-600 bg-slate-50 rounded-lg"><KeyRound size={18} /></button>}
                            <button onClick={() => isTeacherMode ? setIsTeacherMode(false) : setShowPinModal(true)} className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-bold shadow-sm active:scale-95 transition-all ${isTeacherMode ? "bg-rose-50 text-rose-600 border border-rose-100" : "bg-indigo-600 text-white shadow-indigo-200"}`}>{isTeacherMode ? <Unlock size={14} /> : <Lock size={14} />}{isTeacherMode ? "Çıkış" : "Giriş"}</button>
                        </div>
                    </div>
                </div>

                {/* DUYURU - Genişleyebilir */}
                <div className="px-4 mt-6 w-full min-w-max">
                    <div className="bg-amber-50/80 border border-amber-100 p-4 rounded-xl relative max-w-5xl mx-auto md:mx-0">
                        <div className="flex items-start gap-3">
                            <div className="bg-white p-1.5 rounded-full shadow-sm text-amber-500 mt-0.5"><Megaphone size={18} /></div>
                            <div className="flex-1">
                                <h3 className="font-bold text-amber-900 text-sm mb-1">Duyurular</h3>
                                {isEditingAnnouncement ? (
                                    <div className="mt-2">
                                        <textarea className="w-full p-2 border border-amber-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-400 outline-none" rows={3} value={tempAnnouncement} onChange={(e) => setTempAnnouncement(e.target.value)}/>
                                        <div className="flex justify-end gap-2 mt-2">
                                            <button onClick={() => setIsEditingAnnouncement(false)} className="px-3 py-1.5 text-xs font-bold text-slate-500 bg-white rounded-lg">Vazgeç</button>
                                            <button onClick={saveAnnouncementFn} className="px-3 py-1.5 text-xs font-bold bg-amber-600 text-white rounded-lg">Kaydet</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-slate-700 text-sm whitespace-pre-wrap leading-relaxed">{announcement}</div>
                                )}
                            </div>
                            {isTeacherMode && !isEditingAnnouncement && (
                                <button onClick={() => { setTempAnnouncement(announcement); setIsEditingAnnouncement(true); }} className="p-1.5 text-amber-400 bg-white rounded-lg shadow-sm"><Edit3 size={16} /></button>
                            )}
                        </div>
                    </div>
                </div>

                {/* SINIF LİSTESİ - INFINITE CANVAS */}
                <div className="px-3 mt-6 flex flex-col gap-4 w-full min-w-max pb-20">
                    {classes.length === 0 && !loading && (
                        <div className="text-center py-16 bg-white rounded-2xl border-2 border-dashed border-slate-200 mx-2 max-w-lg">
                            <h2 className="text-slate-400 font-medium text-sm">Sınıf bulunamadı.</h2>
                            {isTeacherMode && <button onClick={() => openModal('class')} className="mt-3 text-indigo-600 font-bold text-sm underline">Sınıf Ekle</button>}
                        </div>
                    )}

                    {classes.map((cls) => (
                        <div key={cls.id} className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden w-full transition-all">
                            {/* Sınıf Kartı Başlığı */}
                            <div 
                                className="bg-white p-4 flex items-center justify-between cursor-pointer active:bg-slate-50 touch-manipulation sticky left-0" 
                                onClick={() => toggleClass(cls.id)}
                            >
                                <div className="flex items-center gap-3">
                                    <div className={`p-1.5 rounded-lg transition-transform duration-200 ${cls.isOpen ? 'bg-indigo-600 text-white rotate-90' : 'bg-slate-100 text-slate-400'}`}>
                                        <ChevronRight size={18} />
                                    </div>
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-800">{cls.className}</h2>
                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wide">{cls.students.length} ÖĞRENCİ</span>
                                    </div>
                                </div>
                                {isTeacherMode && (
                                    <div className="flex items-center gap-1">
                                        <button onClick={(e) => { e.stopPropagation(); openModal('topic', { classId: cls.id }); }} className="p-2 text-indigo-600 bg-indigo-50 rounded-lg"><Layout size={18}/></button>
                                        <button onClick={(e) => deleteClass(e, cls.id)} className="p-2 text-rose-400 bg-rose-50 rounded-lg"><Trash2 size={18}/></button>
                                    </div>
                                )}
                            </div>

                            {/* Açılan İçerik (Tablo) */}
                            {cls.isOpen && (
                                <div className="border-t border-slate-100">
                                    {/* table-container sınıfını kaldırdık, direct rendering */}
                                    <div className="w-full">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr>
                                                    {/* SOL ÜST KÖŞE */}
                                                    <th rowSpan={2} className="sticky left-0 top-0 z-40 bg-white border-b border-r border-slate-200 min-w-[160px] p-0 align-bottom shadow-[4px_0_8px_-2px_rgba(0,0,0,0.05)]">
                                                        <div className="p-3 text-xs font-black text-slate-400 uppercase tracking-wider h-full flex items-end">Öğrenci</div>
                                                    </th>
                                                    
                                                    {/* KONU BAŞLIKLARI */}
                                                    {cls.topics?.map((topic, index) => {
                                                        const theme = TOPIC_THEMES[index % TOPIC_THEMES.length];
                                                        return (
                                                            <th key={topic.id} colSpan={Math.max(1, (topic.subColumns?.length || 0) + (isTeacherMode ? 1 : 0))} className={`text-center py-2 px-1 border-r border-b border-slate-200 ${theme.bg} ${theme.text} min-w-[120px]`}>
                                                                <div className="flex items-center justify-center gap-1 font-black text-[10px] uppercase">
                                                                    {topic.title}
                                                                    {isTeacherMode && <button onClick={(e) => { e.stopPropagation(); setActiveTopicMenu({ classId: cls.id, topicId: topic.id, anchorEl: e.currentTarget }); }} className="p-1 rounded hover:bg-white/50"><MoreVertical size={12}/></button>}
                                                                </div>
                                                            </th>
                                                        );
                                                    })}
                                                </tr>
                                                <tr>
                                                    {/* KAYNAK BAŞLIKLARI */}
                                                    {cls.topics?.map((topic) => (
                                                        <React.Fragment key={topic.id}>
                                                            {topic.subColumns?.map((col) => (
                                                                <th key={col.id} className="min-w-[100px] py-2 px-1 border-r border-b border-slate-200 bg-slate-50 text-center align-top">
                                                                    <div className="flex flex-col items-center gap-1" onClick={(e) => { if(!isTeacherMode) return; e.stopPropagation(); setActiveColMenu({ classId: cls.id, topicId: topic.id, colId: col.id, anchorEl: e.currentTarget }); }}>
                                                                        <span className="text-[10px] font-bold text-slate-600 line-clamp-2 leading-tight">{col.title}</span>
                                                                        {isTeacherMode && <ChevronDown size={10} className="text-slate-400"/>}
                                                                    </div>
                                                                </th>
                                                            ))}
                                                            {isTeacherMode && (
                                                                <th className="min-w-[40px] border-r border-b border-slate-200 bg-slate-50 text-center align-middle p-0">
                                                                    <button onClick={() => openModal('source', { classId: cls.id, topicId: topic.id })} className="w-full h-full py-3 flex items-center justify-center text-slate-300 hover:text-indigo-600"><Plus size={16} /></button>
                                                                </th>
                                                            )}
                                                        </React.Fragment>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody className="bg-white">
                                                {cls.students.map((student, sIndex) => {
                                                    const rowColor = STUDENT_ROW_COLORS[sIndex % STUDENT_ROW_COLORS.length];
                                                    return (
                                                        <tr key={student.id} style={{ backgroundColor: rowColor }}>
                                                            {/* SOL SÜTUN: ÖĞRENCİ İSMİ (YAPIŞKAN) */}
                                                            <td className="sticky left-0 z-30 border-r border-slate-200/80 py-2 px-3 shadow-[4px_0_8px_-2px_rgba(0,0,0,0.05)]" style={{ backgroundColor: rowColor }}>
                                                                <div className="flex items-center justify-between gap-2">
                                                                    <div 
                                                                        className="flex items-center gap-2 flex-1 min-w-0" 
                                                                        onClick={(e) => { 
                                                                            if (isTeacherMode) { 
                                                                                e.stopPropagation(); 
                                                                                setStudentNoteInput(student.privateNotes || ""); 
                                                                                setSelectedStudent({ student, classId: cls.id }); 
                                                                            } 
                                                                        }}
                                                                    >
                                                                        <div className="w-7 h-7 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs font-bold shrink-0 shadow-sm">{student.name.charAt(0)}</div>
                                                                        <div className="truncate">
                                                                            <span className="font-bold text-slate-800 text-xs block truncate">{student.name}</span>
                                                                            {isTeacherMode && student.privateNotes && <span className="text-[9px] text-indigo-600 flex items-center gap-0.5"><BookOpen size={8}/> Not</span>}
                                                                        </div>
                                                                    </div>
                                                                    {isTeacherMode && <button onClick={(e) => deleteStudent(e, cls.id, student.id)} className="text-slate-400 p-1"><Trash2 size={14}/></button>}
                                                                </div>
                                                            </td>
                                                            
                                                            {/* SAĞ TARAF: NOTLAR */}
                                                            {cls.topics?.map((topic) => (
                                                                <React.Fragment key={topic.id}>
                                                                    {topic.subColumns?.map((col) => {
                                                                        const status = student.grades[col.id] || 'exempt';
                                                                        return (
                                                                            <td key={col.id} className="p-1 border-r border-slate-100/50 text-center align-middle h-12">
                                                                                <div onClick={(e) => { if (!isTeacherMode) return; e.stopPropagation(); setActiveCell({ classId: cls.id, studentId: student.id, colId: col.id, anchorEl: e.currentTarget }); }} className={`w-full h-full flex items-center justify-center ${!isTeacherMode && 'pointer-events-none'}`}>
                                                                                    <StatusBadge status={status} />
                                                                                </div>
                                                                            </td>
                                                                        );
                                                                    })}
                                                                    {isTeacherMode && <td className="border-r border-slate-100/50"></td>}
                                                                </React.Fragment>
                                                            ))}
                                                        </tr>
                                                    );
                                                })}
                                                {isTeacherMode && (
                                                    <tr>
                                                        <td className="sticky left-0 z-30 bg-white border-r border-slate-200 p-3 shadow-[4px_0_8px_-2px_rgba(0,0,0,0.05)] border-t border-slate-100">
                                                            <div className="flex items-center gap-2">
                                                                <input type="text" placeholder="Öğrenci..." className="text-xs bg-slate-50 border-none rounded p-1 w-full focus:ring-1 focus:ring-indigo-500" value={newStudentName} onChange={(e) => setNewStudentName(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addStudent(cls.id)} />
                                                                <button onClick={() => addStudent(cls.id)} disabled={!newStudentName} className="text-[10px] font-bold text-white bg-indigo-600 px-2 py-1.5 rounded disabled:opacity-50">EKLE</button>
                                                            </div>
                                                        </td>
                                                        <td colSpan={100} className="bg-slate-50/50 border-t border-slate-100"></td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    ))}
                    
                    {isTeacherMode && (
                        <div className="sticky bottom-6 left-0 right-0 flex justify-center z-50 pointer-events-none">
                            <button onClick={() => openModal('class')} className="pointer-events-auto flex items-center gap-2 bg-indigo-600 text-white px-6 py-3 rounded-full font-bold shadow-lg shadow-indigo-500/40 hover:scale-105 transition-transform">
                                <Plus size={20}/> <span className="text-sm">YENİ SINIF</span>
                            </button>
                        </div>
                    )}
                </div>

                {/* --- MENÜLER & MODALLAR --- */}
                
                {/* Menüler için ortak style */}
                {[
                    { menu: activeTopicMenu, content: (m) => (
                        <>
                            <div className="p-2">
                                <div className="text-[10px] font-bold text-slate-400 uppercase mb-2">Toplu İşlem</div>
                                <button onClick={() => handleTopicBulkAction('assigned', m.classId, m.topicId)} className="w-full text-left flex items-center gap-2 p-2 rounded hover:bg-amber-50 text-amber-700 text-xs font-bold"><ArrowDownToLine size={14}/> Herkese Ver</button>
                                <button onClick={() => handleTopicBulkAction('done', m.classId, m.topicId)} className="w-full text-left flex items-center gap-2 p-2 rounded hover:bg-green-50 text-green-700 text-xs font-bold"><CheckCircle size={14}/> Herkese Yapıldı</button>
                            </div>
                            <div className="border-t border-slate-100 p-2">
                                <button onClick={() => handleTopicBulkAction('delete', m.classId, m.topicId)} className="w-full text-left flex items-center gap-2 p-2 rounded hover:bg-rose-50 text-rose-600 text-xs font-bold"><Trash2 size={14}/> Konuyu Sil</button>
                            </div>
                        </>
                    )},
                    { menu: activeColMenu, content: (m) => (
                        <div className="p-2"><button onClick={() => deleteColumn(m.classId, m.topicId, m.colId)} className="w-full text-left flex items-center gap-2 p-2 rounded hover:bg-rose-50 text-rose-600 text-xs font-bold"><Trash2 size={14}/> Kaynağı Sil</button></div>
                    )},
                    { menu: activeCell, content: (m) => (
                        <div className="p-2 grid grid-cols-1 gap-1">
                            {STATUS_OPTIONS.map(opt => (
                                <button key={opt.id} onClick={() => updateGrade(m.classId, m.studentId, m.colId, opt.id)} className="flex items-center gap-3 p-2 rounded hover:bg-slate-50 text-left">
                                    <opt.icon size={16} className={opt.color} />
                                    <span className="text-xs font-bold text-slate-700">{opt.label}</span>
                                </button>
                            ))}
                        </div>
                    )}
                ].map((item, idx) => item.menu && (
                    <div 
                        key={idx}
                        className="fixed z-[70] bg-white rounded-xl shadow-2xl border border-slate-100 w-48 animate-in fade-in zoom-in-95 duration-200"
                        style={{ 
                            top: Math.min(item.menu.anchorEl.getBoundingClientRect().bottom + 5, window.innerHeight - 200), 
                            left: Math.min(Math.max(10, item.menu.anchorEl.getBoundingClientRect().left), window.innerWidth - 200) 
                        }}
                        onClick={(e) => e.stopPropagation()}
                    >
                        {item.content(item.menu)}
                    </div>
                ))}

                {/* Input Modal */}
                {modalType && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden animate-in zoom-in-95">
                            <div className="bg-slate-50 p-4 border-b border-slate-100 flex justify-between items-center"><h3 className="font-bold text-slate-800">{modalType === 'class' ? 'Sınıf Ekle' : 'Ekle'}</h3><button onClick={closeModal}><X size={20} className="text-slate-400"/></button></div>
                            <div className="p-6">
                                <input autoFocus type="text" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-indigo-500 outline-none font-bold text-slate-800" placeholder="İsim Giriniz..." value={modalInputVal} onChange={(e) => setModalInputVal(e.target.value)} />
                            </div>
                            <div className="p-4 bg-slate-50 flex gap-3"><button onClick={closeModal} className="flex-1 py-3 font-bold text-slate-500">Vazgeç</button><button onClick={handleModalSubmit} className="flex-1 py-3 rounded-xl font-bold text-white bg-indigo-600">Kaydet</button></div>
                        </div>
                    </div>
                )}

                {/* Confirm Modal */}
                {confirmModal && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl p-6 max-w-xs w-full text-center animate-in zoom-in-95">
                            <div className={`w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4 ${confirmModal.type === 'danger' ? 'bg-rose-100 text-rose-600' : 'bg-indigo-100 text-indigo-600'}`}><AlertTriangle size={24} /></div>
                            <p className="text-slate-600 font-bold mb-6">{confirmModal.message}</p>
                            <div className="flex gap-3"><button onClick={() => setConfirmModal(null)} className="flex-1 py-2.5 rounded-lg border border-slate-200 text-slate-600 font-bold">İptal</button><button onClick={confirmModal.onConfirm} className={`flex-1 py-2.5 rounded-lg text-white font-bold ${confirmModal.type === 'danger' ? 'bg-rose-600' : 'bg-indigo-600'}`}>Evet</button></div>
                        </div>
                    </div>
                )}

                {/* Öğrenci Notu Modal */}
                {selectedStudent && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl flex flex-col max-h-[80vh] animate-in zoom-in-95">
                            <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                                <h3 className="font-bold text-slate-800">{selectedStudent.student.name}</h3>
                                <button onClick={() => setSelectedStudent(null)}><X size={20} className="text-slate-400"/></button>
                            </div>
                            <div className="p-4 flex-1"><textarea className="w-full h-40 p-3 border border-slate-200 rounded-xl bg-slate-50 focus:border-indigo-500 outline-none text-sm" placeholder="Notlar..." value={studentNoteInput} onChange={(e) => setStudentNoteInput(e.target.value)}></textarea></div>
                            <div className="p-4 border-t border-slate-100 flex justify-end"><button onClick={saveStudentNote} className="px-6 py-2 bg-indigo-600 text-white font-bold rounded-lg flex items-center gap-2"><Save size={16} /> Kaydet</button></div>
                        </div>
                    </div>
                )}

                {/* Pin Modal */}
                {showPinModal && (
                    <div className="fixed inset-0 bg-slate-900/90 z-[100] flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl p-8 w-full max-w-xs text-center animate-in zoom-in-95">
                            <h3 className="text-xl font-black text-slate-800 mb-6">Öğretmen Girişi</h3>
                            <input autoFocus type="password" className="w-full text-center text-3xl font-mono tracking-widest p-3 border-2 border-slate-100 rounded-xl focus:border-indigo-500 outline-none mb-6" placeholder="****" value={pinInput} onChange={(e) => setPinInput(e.target.value)} onKeyDown={(e) => { if(e.key==='Enter'){ if(pinInput===dbTeacherPin){setIsTeacherMode(true);setShowPinModal(false);setPinInput("");}else{alert("Hatalı PIN");} } }} />
                            <button onClick={() => { if(pinInput===dbTeacherPin){setIsTeacherMode(true);setShowPinModal(false);setPinInput("");}else{alert("Hatalı PIN");} }} className="w-full py-3 text-white bg-indigo-600 rounded-xl font-bold mb-3">GİRİŞ</button>
                            <button onClick={() => setShowPinModal(false)} className="text-slate-400 text-sm font-bold">Vazgeç</button>
                        </div>
                    </div>
                )}
                
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HomeworkTracker />);
    </script>
</body>
</html>
